[network]
bind_ip = "0.0.0.0"
sensor_port = 5006
actuator_cmd_port = 5005

[server_heartbeat]
interval_ms = 200
broadcast_port = 5005
broadcast_ip = "192.168.2.255"

[heartbeat_service]
enabled = true
backend_url = "http://127.0.0.1:8082"
interval_ms = 200
broadcast_ip = "192.168.2.255"
broadcast_port = 5005

[config_broadcast_service]
enabled = true
backend_url = "http://127.0.0.1:8082"
interval_ms = 1000

[data_logger_service]
enabled = true
ws_url = "ws://127.0.0.1:8081"

[database]
host = "127.0.0.1"
port = 2240
auto_flush_interval_ms = 100
max_buffer_size = 4096
connection_retry_attempts = 3
connection_retry_delay_ms = 1000

[gui]
downsample_mode = "envelope"
points_per_second = 20
tabs = [
  "unified",
  "lcs-tcs-rtd",
  "boards",
  "self-tests",
  "session",
  "config"
]

  [[gui.pressure_bars]]
  label = "GN2 HI"
  role = "GN2 High"
  limits = "GN2_High"
  color = "#ADFF2F"

  [[gui.pressure_bars]]
  label = "GN2 REG"
  role = "GN2 Regulated"
  limits = "GN2_Regulated"
  color = "#228B22"

  [[gui.pressure_bars]]
  label = "FUEL UP"
  role = "Fuel Upstream"
  limits = "Fuel_Upstream"
  color = "#FF4500"

  [[gui.pressure_bars]]
  label = "FUEL DN"
  role = "Fuel Downstream"
  limits = "Fuel_Downstream"
  color = "#CC0000"

  [[gui.pressure_bars]]
  label = "LOX UP"
  role = "Ox Upstream"
  limits = "Ox_Upstream"
  color = "#38BDF8"

  [[gui.pressure_bars]]
  label = "LOX DN"
  role = "Ox Downstream"
  limits = "Ox_Downstream"
  color = "#4169E1"

  [[gui.pressure_bars]]
  label = "GSE LO"
  role = "GSE Low"
  limits = "GSE_Low"
  color = "#D8B4FE"

  [[gui.pressure_bars]]
  label = "GSE MID"
  role = "GSE Mid"
  limits = "GSE_Mid"
  color = "#C026D3"

  [[gui.pressure_bars]]
  label = "GSE HI"
  role = "GSE High"
  limits = "GSE_High"
  color = "#7B2FBE"

  [[gui.pressure_bars]]
  label = "CHAMBER"
  role = "Chamber Mid PT 1"
  avg_roles = [ "Chamber Mid PT 1", "Chamber Mid PT 2" ]
  limits = "Chamber"
  color = "#F97316"

# Explicit sensor→page membership (replaces role-name substring parsing in the plot pages).
# Group name → ordered list of sensor role names; array order = display order on that page.
# Roles must match the [sensor_roles_*] names. Sensors only for now.
[gui.groups]
LOX = [ "Ox Upstream", "Ox Downstream", "LOX Upper", "LOX Mid", "LOX Lower", "COPV RTD" ]
Fuel = [ "Fuel Upstream", "Fuel Downstream" ]
Chamber = [ "Chamber Mid PT 1", "Chamber Mid PT 2", "Chamber Throat PT 1", "Chamber Throat PT 2" ]

[time_sync]
mode = "board-clock"
window_seconds = 10
max_plausible_gap_s = 60
max_batch_age_s = 5
resync_threshold_ms = 1000
log_interval_s = 10

[logs]
backend_udp_port = 8092

[adc]
internal_v = 2.5
vdd_nominal_v = 5
absolute_5v_v = 5

[discovery]

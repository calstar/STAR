[system]
mode = "GROUND"
state = "GSE"

[network]
bind_ip = "0.0.0.0"
sensor_port = 5006
actuator_cmd_port = 5005
buffer_size = 1024

[server_heartbeat]
interval_ms = 200
broadcast_port = 5005
broadcast_ip = "192.168.2.255"

[heartbeat_service]
enabled = true
backend_url = "http://127.0.0.1:8082"
interval_ms = 200
broadcast_ip = "192.168.2.255"
broadcast_port = 5005

[config_broadcast_service]
enabled = true
backend_url = "http://127.0.0.1:8082"
interval_ms = 1000

[data_logger_service]
enabled = true
ws_url = "ws://127.0.0.1:8081"

[database]
host = "127.0.0.1"
port = 2240
auto_flush_interval_ms = 100
max_buffer_size = 4096
connection_retry_attempts = 3
connection_retry_delay_ms = 1000

[gui]
downsample_mode = "envelope"
points_per_second = 20
tabs = [ "unified", "boards", "config", "calibration", "session" ]

[[gui.pressure_bars]]
label = "FF Vent"
role = "Fuel Fill Vent"
limits = ""
color = "#ff0000"

[[gui.pressure_bars]]
label = "Fuel Up"
role = "Fuel Upstream"
limits = "Fuel_Upstream"
color = "#00ff2a"

[[gui.pressure_bars]]
label = "Dome CTRL"

[pressure_mappings]
GN2 = 6
ETH = 1
LOX = 5

[display]
adc_bits = 32
window_seconds = 26
y_axis_min = 0
y_axis_max = 700
y_axis_autoscale = true
only_show_actuators_with_roles = true
only_show_pt_with_roles = true
graph_ma_samples = 1
display_ma_samples = 1

[state_machine]
actuator_csv = "config/state_machine_actuators.csv"
actuator_delay_csv = "config/state_machine_actuator_delays.csv"
transitions_csv = "config/state_transitions.csv"

[controller]
pwm_frequency_hz = 6
pwm_duration_ms = 2000
fallback_fuel_duty_cycle = 0
fallback_ox_duty_cycle = 0
controller_loop_hz = 100
controller_service_url = "http://localhost:8000"
controller_config_path = ""
P_copv_min_pa = 0
command_type = "THRUST_DESIRED"
thrust_desired = 1000
altitude_goal = 0
pressure_fuel_target = 0
pressure_ox_target = 0
duty_sweep_enabled = false
duty_sweep_step_duration_sec = 2
duty_sweep_steps = [ [ 0.1, 0.1 ], [ 0.3, 0.2 ], [ 0.5, 0.4 ], [ 0.3, 0.3 ], [ 0.1, 0.1 ] ]
use_cpp_controller = true
lut_path = "output/lut/controller_policy_fsw.bin"
thrust_curve_path = "output/lut/thrust_curve.csv"
engine_lut_path = "output/lut/engine_performance.npz"

[phase2]
enabled = false
drift_threshold = 2
process_noise = 0.000001
ema_smoothing_alpha = 0.02
forgetting_factor = 0.995
save_interval_seconds = 300
min_residuals_for_drift_check = 10
absolute_drift_threshold_psi = 2
consensus_threshold_psi = 1
consensus_update_rate = 0.1

[logs]
backend_udp_port = 8092

[fire]
state = "Fire"
expiry_target = "Armed"
duration_ms = 1000
extended_ms = 1000


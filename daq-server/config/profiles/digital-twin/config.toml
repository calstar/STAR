[actuator_abbrev]
FV = "Fuel Vent"
OV = "LOX Vent"
FP = "Fuel Press"
OP = "LOX Press"
FM = "Fuel Main"
OM = "LOX Main"
FF = "Fuel Fill"

[actuator_service]
port = 9998
bind_address = "0.0.0.0"

[controller_service]
port = 9999
fire_duration_ms = 6000
fire_extended_ms = 10000

[routing.pt_raw]
packet_id = [ 32, 0 ]
channels = 14
description = "Raw PT ADC counts — 0x01..0x0E (board1: 1-7, board2+offset10: 11-14)"

[routing.pt_calibrated]
packet_id = [ 32, 16 ]
channels = 30
description = "Calibrated PT pressure (PSI) — 0x11..0x1E (board1: 0x11-0x17, board2: 0x1B-0x1E)"

[routing.tc_raw]
packet_id = [ 33, 0 ]
channels = 20
description = "Raw TC ADC counts"

[routing.rtd_raw]
packet_id = [ 34, 0 ]
channels = 20
description = "Raw RTD resistance counts"

[routing.lc_raw]
packet_id = [ 35, 0 ]
channels = 20
description = "Raw LC ADC counts"

[routing.lc_calibrated]
packet_id = [ 35, 16 ]
channels = 20
description = "Calibrated LC force"

[routing.actuator_status]
packet_id = [ 48, 0 ]
channels = 20
description = "Actuator current sense readings"

[routing.actuator_cal]
packet_id = [ 49, 0 ]
channels = 20
description = "Calibrated actuator current (amps) from calibration_service"

[routing.encoder_raw]
packet_id = [ 36, 0 ]
channels = 2
description = "Raw encoder angle (0-4095) — AS5600 12-bit"

[daq_bridge]
publish = [ "pt_raw", "tc_raw", "rtd_raw", "lc_raw", "actuator_status", "actuator_cal", "encoder_raw" ]

[calibration]
enabled = true
use_robust_stack = true
exclude_hp_pt = true
prior_from_polynomial = true

[calibration.orchestrator]
consensus_enabled = true
self_cal_alpha_threshold = 0.6
agreement_threshold = 0.6
min_points = 5
target_points = 15
max_points = 30
min_r_squared = 0.95
target_r_squared = 0.99
rls_forgetting_factor = 0.995
drift_glr_threshold = 3
auto_save_interval_sec = 300
status_interval_sec = 30

[calibration.pt]
json_dir = "scripts/calibration/calibrations"
csv_paths = [ "../firmware/PT_Board/Calibration/PT Calibration Attempt 2026-02-04_test2.csv" ]

[calibration.tc]
json_dir = "scripts/calibration/calibrations/tc"
csv_paths = []
adc_ref_voltage = 2.5

[calibration.rtd]
json_dir = "scripts/calibration/calibrations/rtd"
csv_paths = []
r0_ohm = 1000
adc_ref_voltage = 2.5
excitation_ua = 1000

[calibration.lc]
json_dir = "scripts/calibration/calibrations/lc"
csv_paths = []
sensitivity_mv_per_v = 2
pga_gain = 32
full_scale_value = 300

[calibration.sidecar]
enabled = true
host = "127.0.0.1"
port = 8100
relay_host = "127.0.0.1"
relay_port = 9090
reconnect_interval_ms = 5000
adc_forward_interval_ms = 200
write_interval_sec = 0.01
write_to_elodin = false

[calibration.environmental]
temperature = 25
humidity = 50
vibration = 0
aging_factor = 1
mounting_torque = 1
min_consensus_sensors = 2


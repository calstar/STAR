# NOTE: [pressure_mappings] (old system→channel index, superseded by [sensor_roles_*])
# and [display] (GUI defaults nothing reads) removed 2026-08-13 — dead config.

# =============================================================================
# State Machine
# =============================================================================
[state_machine]
actuator_csv = "config/state_machine_actuators.csv"
actuator_delay_csv = "config/state_machine_actuator_delays.csv"
# Repo-local state transition matrix; sequencer + backend both resolve via state_machine.transitions_csv
transitions_csv = "config/state_transitions.csv"

# =============================================================================
# Controller Settings (PWM Control)
# =============================================================================
[controller]
# PWM frequency for actuator control (Hz)
pwm_frequency_hz = 6.0
# PWM command duration (ms) - how long each command stays active
pwm_duration_ms = 2000
# Fallback duty cycles when controller service is unavailable (0.0-1.0).
# When controller_service runs, non-zero values also act as open-loop test duty (bypass DDP/LUT).
# For LUT mode, set both to 0 so the LUT is used.
fallback_fuel_duty_cycle = 0.0
fallback_ox_duty_cycle = 0.0
# Controller loop update rate (Hz)
controller_loop_hz = 100.0
# Controller service URL
controller_service_url = "http://localhost:8000"
# Controller config path (YAML file relative to engine_sim/configs/). If empty, uses default.
# Example: "controller_default.yaml" or "hotfire_conservative.yaml"
controller_config_path = ""
# Minimum COPV/tank pressure (Pa) required by safety filter before PWM is allowed.
# Set to 0 to disable the constraint (simulation / open-loop test).
# For a real hotfire with COPV, set to ~689476 (100 psi) or higher.
P_copv_min_pa = 0.0

# Controller Targets (used when state machine enters FIRE state)
# command_type can be: "THRUST_DESIRED", "ALTITUDE_GOAL", or "PRESSURE_TARGET"
command_type = "THRUST_DESIRED"
thrust_desired = 1000.0        # Target thrust in Newtons
altitude_goal = 0.0            # Target altitude (if using ALTITUDE_GOAL)
pressure_fuel_target = 0.0     # Target fuel pressure (if using PRESSURE_TARGET)
pressure_ox_target = 0.0       # Target ox pressure (if using PRESSURE_TARGET)
# Duty sweep: open-loop multi-step test (no controller service needed).
duty_sweep_enabled = false
duty_sweep_step_duration_sec = 2.0
# Steps as [fuel_duty, ox_duty] in 0.0-1.0; 5 steps x 2s = 10s
duty_sweep_steps = [[0.1, 0.1], [0.3, 0.2], [0.5, 0.4], [0.3, 0.3], [0.1, 0.1]]

# Use C++ RobustDDPController service for PWM instead of Python FastAPI.
# When true, the web backend will not start its own controller loop or send PWM.
use_cpp_controller = true

# Policy LUT path for C++ controller. If set and load succeeds, bypasses DDP
# and uses precomputed duty_F/duty_O from LUT (multilinear interpolation).
# Generate: ./scripts/controller_lut/generate_engine_and_policy_lut.sh full
lut_path = "output/lut/controller_policy_fsw.bin"
# Thrust curve CSV (time_s,thrust_N) from Layer 2 pressure curves. When set, F_ref follows curve.
thrust_curve_path = "output/lut/thrust_curve.csv"

# Engine LUT path (for Python controller / SITL). Stems from engine config + tank pressure range.
# When set, DDP uses fast LUT lookups instead of physics. Generate with engine_lut_config.yaml.
engine_lut_path = "output/lut/engine_performance.npz"

# NOTE: [phase2], [calibration.sidecar], [calibration.environmental] removed 2026-08-13 — dead config
# (deprecated Python autonomous-cal / sidecar; the live C++ calibration_service reads none of them).

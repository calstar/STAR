[system]
mode = "FLIGHT"
state = "FLIGHT"

[system.network]
base_ip = "192.168.3.0"
ip_range_start = 100
ip_range_end = 150
bind_address = "0.0.0.0"
bind_port = 5005

[database]
db_host = "127.0.0.1"
db_port = 2240
auto_flush_interval_ms = 100
max_buffer_size = 2048
connection_retry_attempts = 3
connection_retry_delay_ms = 1000

[sensors.flight.pt.PT_HP]
board_id = 0
channel = 0
message_id = 8192
max_psi = 5000
purpose = "High pressure"

[sensors.flight.pt.PT_LP]
board_id = 0
channel = 1
message_id = 8193
max_psi = 1000
purpose = "COPV post regulator"

[sensors.flight.pt.PT_FUP]
board_id = 1
channel = 0
message_id = 8208
max_psi = 1000
purpose = "Fuel upstream"

[sensors.flight.pt.PT_FDP]
board_id = 1
channel = 1
message_id = 8209
max_psi = 1000
purpose = "Fuel downstream"

[sensors.flight.pt.PT_OUP]
board_id = 2
channel = 0
message_id = 8224
max_psi = 1000
purpose = "Oxidizer upstream"

[sensors.flight.pt.PT_ODP]
board_id = 2
channel = 1
message_id = 8225
max_psi = 1000
purpose = "Oxidizer downstream"

[sensors.flight.rtd.RTD_COPV]
board_id = 3
channel = 0
message_id = 8752
purpose = "COPV temperature"
location = "COPV"

[sensors.flight.rtd.RTD_LOX_1]
board_id = 3
channel = 1
message_id = 8753
purpose = "LOX tank temperature top"
location = "LOX_tank"

[sensors.flight.rtd.RTD_LOX_2]
board_id = 3
channel = 2
message_id = 8754
purpose = "LOX tank temperature middle"
location = "LOX_tank"

[sensors.flight.rtd.RTD_LOX_3]
board_id = 3
channel = 3
message_id = 8755
purpose = "LOX tank temperature bottom"
location = "LOX_tank"

[sensors.flight.tc.TC_CHAMBER_1]
board_id = 4
channel = 0
message_id = 8512
purpose = "Chamber temperature front"
location = "chamber"

[sensors.flight.tc.TC_CHAMBER_2]
board_id = 4
channel = 1
message_id = 8513
purpose = "Chamber temperature middle"
location = "chamber"

[sensors.flight.tc.TC_CHAMBER_3]
board_id = 4
channel = 2
message_id = 8514
purpose = "Chamber temperature rear"
location = "chamber"

[sensors.flight.tc.TC_CHAMBER_4]
board_id = 4
channel = 3
message_id = 8515
purpose = "Chamber temperature side"
location = "chamber"

[sensors.flight.lc.LC_CHAMBER_1]
board_id = 5
channel = 0
message_id = 9040
purpose = "Chamber load cell 1"
location = "chamber"

[sensors.flight.lc.LC_CHAMBER_2]
board_id = 5
channel = 1
message_id = 9041
purpose = "Chamber load cell 2"
location = "chamber"

[sensors.flight.lc.LC_CHAMBER_3]
board_id = 5
channel = 2
message_id = 9042
purpose = "Chamber load cell 3"
location = "chamber"

[sensors.flight.actuator.ACTUATOR_LOX_MAIN]
board_id = 6
channel = 0
message_id = 20576
purpose = "LOX main valve"
location = "lox_line"

[sensors.flight.actuator.ACTUATOR_FUEL_MAIN]
board_id = 6
channel = 1
message_id = 20577
purpose = "Fuel main valve"
location = "fuel_line"

[sensors.flight.actuator.ACTUATOR_LOX_VENT]
board_id = 6
channel = 2
message_id = 20578
purpose = "LOX vent valve"
location = "lox_line"

[sensors.flight.actuator.ACTUATOR_FUEL_VENT]
board_id = 6
channel = 3
message_id = 20579
purpose = "Fuel vent valve"
location = "fuel_line"

[sensors.flight.actuator.ACTUATOR_LOX_PRESS]
board_id = 6
channel = 4
message_id = 20580
purpose = "LOX pressurant valve"
location = "lox_line"

[sensors.flight.actuator.ACTUATOR_FUEL_PRESS]
board_id = 6
channel = 5
message_id = 20581
purpose = "Fuel pressurant valve"
location = "fuel_line"

[discovery]
enabled = true
network_interface = "eth0"
mode = "hybrid"
announcement_port = 2245
discovery_timeout_seconds = 30
auto_update_config = true
config_update_interval_seconds = 60

[sensor_data]
update_rate_hz = 10
enable_all_sensors = true

[calibration]
enabled = true
calibration_file = "calibration/data/flight_calibration.json"

[controller]
duty_sweep_steps = [ [ 0.1, 0.1 ], [ 0.3, 0.2 ], [ 0.5, 0.4 ], [ 0.3, 0.3 ], [ 0.1, 0.1 ] ]
duty_sweep_step_duration_sec = 2

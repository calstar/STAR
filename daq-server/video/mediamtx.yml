# The VIDCOMM video gateway (MediaMTX). One file for every site: star-rfs runs it as
# sensor-video, the media Mac runs it through scripts/video-gateway.sh, CI runs it too.
#
# Nothing here names a camera. The DAQ backend owns config/video.json and pushes one
# `raw/<stream id>` path per stream through the control API; the gateway keeps them in
# memory only, and the backend re-pushes them whenever the gateway comes back.
#
# Who may do what:
#   * From this machine (the DAQ backend at the workspace): everything, no password.
#   * From anywhere else: nothing -- unless the launcher was given a gateway password
#     (scripts/video-gateway.sh --set-password), which adds user "daq" with the control API
#     and WebRTC reads. That is how a DAQ backend on another laptop drives a gateway on
#     the media Mac (the desert). The password is never in this file.
#   * Browsers never call the gateway's HTTP side. Their handshake goes through the DAQ
#     backend (/api/video/...), and only the media itself (UDP, webrtcLocalUDPAddress)
#     flows browser <-> gateway directly.
#   * OBS: user "obs" (--set-obs-password) may read over RTSP, nothing else.
#   * Publishing stays localhost-only.
# Any setting can be overridden per run with MTX_<KEY> environment variables
# (e.g. MTX_APIADDRESS=127.0.0.1:18887), which is how the tests move the ports.

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1452

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

api: true
# Not MediaMTX's default 9997: that is the DAQ's OTA service (OTA_SERVICE_CMD_PORT).
# Its metrics/pprof defaults (9998 actuator, 9999 fire) are off below for the same reason.
# All interfaces, so a remote backend can reach it -- with the password, see above.
apiAddress: :8887

metrics: false
pprof: false
playback: false

# RTSP: how the gateway pulls cameras (as a client, unaffected by this), how local tools
# (the dev fake camera) publish, and how OBS on a streaming laptop reads the feeds
# (rtsp://<gateway>:8554/raw/<id>) -- as user "obs", read-only, when the launcher was given
# an OBS password (--set-obs-password). Anonymous LAN readers are refused. Digest auth, so
# the password does not cross the LAN in the clear. OBS gets camera audio too: mute it there.
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAuthMethods: [digest]

rtmp: false
hls: false
srt: false
moq: false

# WebRTC: the live view. The HTTP side (WHEP) answers the DAQ backend's proxy; the UDP
# port carries video straight to each browser on the LAN.
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []

pathDefaults:
  source: publisher
  # A camera is pulled only while someone watches it (recording, ticket 08, pins
  # the ones it needs).
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  record: false

paths:
  # Dev and CI only: a local publisher (ffmpeg testsrc) can stand in for a camera at
  # rtsp://127.0.0.1:8554/fake/<name>. Publishing is localhost-only, so nothing on the
  # LAN can appear here.
  "~^fake/[a-z0-9-]+$":
    source: publisher
    sourceOnDemand: false

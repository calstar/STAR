# CalSTAR ethalox 8 kN -- SHIP. 2026-09-14.  Supersedes every ethalox_8kN_* before it.
#
# Reproduce:  python3 scripts/layer1_run.py --config configs/ethalox_8kN_SHIP.yaml
#             (seed 71 is pinned in layer1_random_seed; 3 of 5 seeds land here)
# Audit:      python3 scripts/design_robustness.py configs/ethalox_8kN_SHIP.yaml
#
#   thrust      8000.3 N        O/F       1.6576  (target 1.65, +0.5 %)
#   Pc           432.4 psia     Isp       238.71 s
#   eta_c*      0.9509          bore      127.000 mm = 5.0000 in
#   L*          1.0000 m        chamber   face->throat 153.5 mm
#   27 doublets   theta 40 / 50 deg   d_jet 1.709 / 1.502 mm   Cd 0.80
#
# EVERY DECLARED LIMIT, CHECKED WITH NO GATE SLACK FORGIVEN:
#   thrust 8000 +/-2 %                8000.3 N            PASS
#   O/F 1.65 +/-5 %                   1.6576              PASS
#   dP/Pc both sides in [0.20,0.40]   0.321 / 0.321       PASS  (mid-band)
#   doublets <= 30                    27                  PASS
#   included angle <= 90 deg          90                  PASS  (SP-8089 threshold)
#   every jet >= 40 deg               40 / 50             PASS  (machining floor)
#   face incidence >= 40 deg          50 / 40             PASS  (drill does not walk)
#   centre clear >= 38.10 mm          67.44               PASS  (3/8-18 NPT boss needs 27.15)
#   web >= 2.00 mm                    6.40 / 9.64         PASS
#   wall land >= 8.00 mm              14.45               PASS
#   spray radius 0.707 +/-0.08 r      0.634               PASS  (40.1 % of A_c fed)
#   standoff L/d in [3,5]             4.00                PASS
#   tilt <= reach allowance           +5.55 vs 5.76       PASS  (no slack used)
#   injector drawing warnings         0                   PASS
#
# ON THE TILT GATE TOLERANCE (0.5 deg). The safety factor is the 1.5x reach margin, not this.
# A one-sided constraint gets SAT ON -- nothing in the objective pulls a design further inside
# it -- so converged runs land within a few tenths of the allowance and scatter across that
# line. At 0.02 deg a re-run from the UI that reached the liner at 1.39 chamber lengths
# instead of 1.50 reported "Validation failed", which is a brittle gate, not a real finding.
# 0.5 deg here corresponds to roughly a 1.35x floor. THIS DESIGN DOES NOT USE THE TOLERANCE:
# it passes at 5.55 against 5.76 with nothing forgiven, which is what design_audit.py checks.
#
# MACHINING. Both rings are drilled at 40-50 deg from the axis through a 0.500 in plate:
#   LOX  16.58 mm of passage: O4.0 x 9.74 (L/d 2.4) + O1.709 x 6.84 land (L/d 4.0, sets Cd)
#   fuel 19.76 mm of passage: O4.0 x 13.75 (L/d 3.4) + O1.502 x 6.01 land (L/d 4.0)
# Worst case if you skip the counterbore entirely and run the small drill the whole way:
# L/d 9.15. Inside twist-drill practice either way. SPOT-FACE each hole normal to its own
# axis before drilling -- 40 deg of incidence is the floor, not a comfort.
#
# WHAT THE MODEL IS NOT SURE ABOUT (scripts/design_robustness.py, re-solved as written):
#   Cd 0.72 .. 0.88     thrust -4.0 % .. +3.4 %,  dP/Pc 0.369 .. 0.284
#                       -> stays INSIDE the 0.20-0.40 band across the whole range, so a
#                          surprise at the flow test moves thrust, not feasibility.
#   eta_c* 0.951->0.875 thrust -3.7 %, Isp 238.7 -> 218.7. Plan the vehicle at 0.88-0.91.
#   throat +0..9 % area thrust +0..4.8 %, Pc 432 -> 417. Graphite insert is enabled.
#
# STILL REQUIRES HARDWARE, AND NOTHING HERE CAN SETTLE IT:
#   FLOW-TEST the injector. Cd 0.80 is an inlet-geometry correlation. The sweep above is
#   what bounds the consequence; it is not a substitute for the measurement.
#
# BY DESIGN, NOT OVERSIGHT:
#   No fuel barrier row -- that is a third ring, which is excluded. The 14.45 mm wall land
#   is where one would go if that constraint is ever lifted.

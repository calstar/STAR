# Propellant preset: ETHALOX (LOX / ethanol)
# Sources: fluids + CEA copied VERBATIM from origin/main configs/default.yaml (the working
# ethalox-pintle baseline; anchor A fixture tests/golden/anchor_A_*). LOX latent_heat/boiling_point
# were null on main — filled with the same standard values as the methalox preset (stability inputs
# only; forward physics does not read them, so anchor-A bit-compatibility is unaffected).
fluids:
  fuel:
    name: Ethanol
    density: 789.0
    viscosity: 0.0012
    surface_tension: 0.0223
    vapor_pressure: 5800.0
    specific_heat: 2440.0
    thermal_conductivity: 0.17
    temperature: 293.0
    latent_heat: 838000.0
    boiling_point: 351.4
    molecular_weight: 46.07
    bulk_modulus_pa: 1060000000.0   # ethanol @ ~293 K, standard handbook value (stability feed-acoustics)
  oxidizer:
    name: LOX
    density: 1140.0
    viscosity: 0.00018
    surface_tension: 0.013
    vapor_pressure: 101325.0
    specific_heat: 2300.0
    thermal_conductivity: 0.15
    temperature: 90.0
    latent_heat: 213000.0
    boiling_point: 90.2
    molecular_weight: 32.0
    bulk_modulus_pa: 1500000000.0    # order-of-magnitude LOX; refine via test T5
# Chamber-gas properties for the Ingebo aerodynamic Weber number (rho_g = Pc/(R*T)).
#
# These are NOT free constants: the schema defaults (R=360, T=3500) are LOX/CH4 values, and
# were being applied verbatim to ethalox. Read off cea_cache_LOX_Ethanol_3D.npz at the design
# point (MR 1.35, averaged over Pc 300-600 psi), where the truth is Tc=3094 K and R=389 J/kgK
# -- i.e. the methalox default overstated Tc by 13% and understated R by 8%.
#
# The injector solve runs before CEA chamber state exists, so a representative value is the
# design (see SMDConfig). Representative for THIS propellant, at ITS mixture ratio.
spray:
  smd:
    chamber_gas_R: 389.0    # J/(kg*K), LOX/Ethanol @ MR 1.35
    chamber_gas_T: 3094.0   # K,        LOX/Ethanol @ MR 1.35

# NOTE: no feed_system here on purpose. The feed lines are VEHICLE PLUMBING, not a property
# of the propellant -- switching ethalox <-> methalox must not silently resize your tubing.
# Line sizes live in the engine config's own feed_system block as `line_size: 3/8_NPT`.
combustion:
  cea:
    ox_name: LOX
    fuel_name: Ethanol
    cache_file: output/cache/cea_cache_LOX_Ethanol_3D.npz
    Pc_range: [1000000.0, 9000000.0]
    MR_range: [1.0, 2.5]
    eps_range: [4.0, 15.0]
    n_points: 34

  W_geom_ao_af_momentum: 3500.0
  W_MOM: 30000.0
  impinging_momentum_R_min: 0.95
  impinging_momentum_R_max: 1.05
  # Sauter mean diameter (atomization) objective: two-sided deadband around the target.
  # Physics SMD = mass-flux-weighted Ingebo D32_O/D32_F (aerodynamic Weber + liquid Reynolds +
  # impingement angle via the collision velocity). Penalized only outside target*(1 ± rel_tol).
  W_SMD: 0.0  # SMD hint retired: eta_Lstar physics already penalizes poor atomization via delivered c*/thrust
  target_smd_microns: 50.0
  layer1_smd_rel_tol: 0.20
  # Equal-tank-pressure objective. OFF by default (0.0); enabled via the "Match propellant tank
  # pressures" checkbox in the optimizer settings. Independent of R=1: differing densities, feed
  # losses, and injector ΔP mean matched tanks do NOT imply matched momentum. When enabled the
  # optimizer trades orifice area / velocity / angle to satisfy both. Scale = psi gap costing 1 unit².
  W_TANK_EQUAL: 0.0
  layer1_tank_equal_scale_psi: 100.0
  # Element-geometry fit: ring pitch-circle must fit the bore, orifices must not overlap, and
  # (impingement standoff + droplet vaporization length) must fit the chamber length. Gives the
  # `spacing` variable a real job; zero when the layout is comfortable.
  W_IMP_GEOM: 1500.0
  layer1_impinging_angle_deg_min: 55.0
  layer1_impinging_angle_deg_max: 90.0
  W_IMPINGING_ANGLE: 400.0
  W_IMPINGING_JET_ASYM: 180.0

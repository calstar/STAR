# 2026-10-01: the team's latest engine (6800N-Engine.yaml as supplied), with the graphite insert
# set to the GR001CC datasheet and graphite's temperature-dependent specific heat. The injector
# channels (118 / 127 mm2, 2.4x / 3.1x the orifice area) keep every element within +/-0.2 % of the
# mean flow on the ring-network manifold model; no flow change was needed.
# 2026-09-30: tanks 548.7 -> 578.0 psia (564 psig at 626.7 m), nothing else changed. Same hardware and
# propellant load; forward solve gives ~6804 N, LOX-limited burn ~3.55 s. Fields below that record the
# 6500 N design (design_thrust, target_thrust, burn_time, target_burn_time) are deliberately left as-is.
# Ethalox unlike doublet, 6500 N. configs/ethalox_6500N.yaml re-optimised on the 2026-09-26 physics, then
# fitted to the CAD (2026-09-28): straight chamber +2 in (L* 1.359 m, face-to-throat 224.4 mm), 2 feed
# ports per ring (3/8 NPT, in the 0.75 in cover plate).
# Plate geometry is the revolve sketch, configs/cad/ethalox_6500N_injector_revolve_2026-09-28.dxf:
# 0.75 in plate, exits on r 1.250 in (LOX) / 1.660 in (fuel), passages 8.16 mm (L/d 5.00 / 5.55)
# drilled square into the channel facets, channels 118 / 127 mm2 drawn. No centre port.
# Locked: 5.000 in bore (0.5 in ablative + 0.25 in steel in a 6.5 in OD), 24 doublets (15 deg),
# jets 35 deg LOX / 48 deg fuel, L* pinned, 1/2 in x 0.035 feed tubes.
# Tank setpoint solved for 6500 N on the ring-manifold / TN 4222 / Rupe stream-tube physics.
# Checked: scripts/design_handcheck.py, scripts/design_audit.py.

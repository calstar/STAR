# Recovery calculator — Python tooling config.
#
# Deliberately carries ONLY [tool.pytest.ini_options]. There is no
# [tool.black] here: Black walks up from each source file to the first
# pyproject.toml, and the repo-root one owns line-length for the whole tree.
# Adding a [tool.black] table here would silently fork the formatting.
#
# Not a distribution either — no [build-system], no [project]. Nothing in this
# repo is pip-installed; `physics` is imported with the subproject root
# on sys.path, matching EngineDesign/backend/main.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

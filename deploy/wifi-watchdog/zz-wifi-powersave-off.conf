# Disable Wi-Fi power saving.
#
# NetworkManager ships /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
# with `wifi.powersave = 3` (enabled). On the RTL8822BU that is what drives the
# chip into the IPS state it cannot wake from. 2 = disabled.
#
# NetworkManager reads conf.d in alphabetical order and the last file wins, so
# this overrides the distro default without editing a package-owned file that
# an upgrade would silently put back. Note the `zz-` rather than the usual
# `99-`: digits sort BEFORE letters, so `99-` would lose to `default-`.
[connection]
wifi.powersave = 2

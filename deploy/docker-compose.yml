services:

  # ── Reverse proxy + TLS ──────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates (persisted across restarts)
      - caddy_config:/config
    depends_on:
      - auth
      - engine-design-api
      - engine-design-frontend
      - pid-designer-api
      - pid-designer-frontend
      - daq-server
      - landing

  # ── Auth service ─────────────────────────────────────────────────────────
  auth:
    build:
      context: ./auth
    restart: unless-stopped
    env_file: ./auth/.env        # copy from auth/.env.example and fill in
    environment:
      FLASK_ENV: production

  # ── Engine Design ─────────────────────────────────────────────────────────
  engine-design-api:
    build:
      context: ./EngineDesign
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}   # from .env at repo root
    env_file: .env

  engine-design-frontend:
    build:
      context: ./EngineDesign/frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  # ── PID Designer ─────────────────────────────────────────────────────────
  pid-designer-api:
    build:
      context: ./pid-designer
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
    env_file: .env

  pid-designer-frontend:
    build:
      context: ./pid-designer/frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  # ── DAQ Server ────────────────────────────────────────────────────────────
  # The C++ daq_bridge and elodin-db are not containerised yet.
  # This container covers the Next.js web UI only.
  daq-server:
    build:
      context: ./daq-server/diablo_server/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: https://auth.starberkeley.org
    env_file: .env

  # ── Landing page ─────────────────────────────────────────────────────────
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

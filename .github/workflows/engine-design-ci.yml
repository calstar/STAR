name: Engine Design CI

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true, which breaks
# workflow triggers in some parsers (matches daq-server-ci.yml).
'on':
  push:
    paths:
      - 'EngineDesign/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/engine-design-ci.yml'
  pull_request:
    paths:
      - 'EngineDesign/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/engine-design-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: engine-design-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: EngineDesign

jobs:
  # Python regression gate. Fast (~seconds): no gfortran/rocketcea — the
  # CEA-backed configs load a committed cache table (output/cache/*.npz).
  python-tests:
    name: Python tests (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies (CI subset — no rocketcea/gfortran)
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    # EVERY propellant preset the UI exposes must ship a committed CEA cache, so
    # PintleEngineRunner loads (np.load) instead of falling through to a live
    # rocketcea build -- a multi-minute synchronous hang. This fast pre-flight
    # checks all of configs/propellants/*.yaml (not just the methalox table the
    # gate itself needs) and their metadata, and fails loudly before the heavy
    # suite. It is the guard that would have caught kerolox shipping cache-less.
    - name: Verify committed CEA caches are present (all presets)
      run: python -m pytest tests/test_cea_cache_presets.py -q

    # --timeout guards against any test accidentally triggering a live CEA
    # build (which would otherwise hang the runner). thread method so a stuck
    # C/Fortran call is still interrupted.
    - name: Run test gate
      run: |
        python -m pytest tests/ \
          --timeout=120 --timeout-method=thread \
          --durations=15 -q

  # Backend imports cleanly (FastAPI app + all routers load).
  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    - name: Import backend app
      run: python -c "import backend.main; print('backend.main imports OK')"

  # Frontend type-checks and builds (tsc -b && vite build). eslint runs as a
  # non-blocking signal: there is a backlog of pre-existing lint findings
  # (mostly no-explicit-any) that should be cleaned up but should not gate.
  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: EngineDesign/frontend/package-lock.json

    - name: Install dependencies
      working-directory: EngineDesign/frontend
      run: npm ci || npm install

    - name: TypeScript build
      working-directory: EngineDesign/frontend
      run: npm run build

    - name: ESLint (non-blocking — pre-existing backlog)
      working-directory: EngineDesign/frontend
      run: npm run lint
      continue-on-error: true

  # Browser E2E (Playwright). Playwright's webServer auto-boots the FastAPI
  # backend (ED_USE_NATIVE=0 -> pure Python, so no C build here) and Vite, so
  # this job just needs Python deps, node deps, and Chromium. The guard that
  # matters is connect-no-loop.spec.ts: it asserts idle /api/config/load traffic
  # settles instead of the ~7 req/s bootstrap fetch loop that hung the UI. tsc
  # does not catch that (the effect deps are "correct"); only a running app does.
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install backend dependencies (CI subset — no rocketcea/gfortran)
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    # The default config (methalox) loads its committed cache on backend boot;
    # a missing cache would fall through to a live build and hang the webServer.
    - name: Verify committed CEA caches are present (all presets)
      run: python -m pytest tests/test_cea_cache_presets.py -q

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: EngineDesign/frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: EngineDesign/frontend
      run: npm ci || npm install

    # ~/.cache/ms-playwright is NOT covered by setup-node's npm cache, so cache
    # the Chromium download (~115 MB) keyed on the lockfile.
    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('EngineDesign/frontend/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-

    - name: Install Playwright Chromium
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      working-directory: EngineDesign/frontend
      run: npx playwright install chromium

    # System libs for Chromium (apt) — not covered by the browser-binary cache,
    # so run every time (fast; a no-op when already present).
    - name: Install Playwright system dependencies
      working-directory: EngineDesign/frontend
      run: npx playwright install-deps chromium

    - name: Run Playwright E2E
      working-directory: EngineDesign/frontend
      run: npx playwright test

    - name: Upload Playwright traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-traces
        path: EngineDesign/frontend/test-results/
        if-no-files-found: warn
        retention-days: 7

  # Native C physics kernel: compile libed_physics and run its golden-vector /
  # unit tests via CTest. Fully self-contained — golden vectors are committed
  # (engine/native/tests/golden/), so no rocketcea/Python is involved. ubuntu
  # ships gcc + cmake. ED_NATIVE_ARCH=OFF drops -march=native for a portable,
  # runner-independent build; chamber_golden self-skips (exit 77) until that
  # stage lands (CTest reports it skipped, not failed).
  native-kernel:
    name: Native kernel (C golden/unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure + build (portable — no -march=native)
      working-directory: EngineDesign/engine/native
      run: cmake -S . -B build -DED_NATIVE_ARCH=OFF && cmake --build build -j

    - name: Run CTest suite
      working-directory: EngineDesign/engine/native
      run: ctest --test-dir build --output-on-failure

  # Accelerator parity. The Layer-1 inner loop runs on engine/accel (numba); the
  # C port in engine/native is the outgoing implementation and is kept here as a
  # numeric oracle until it is deleted. The matrix runs the production impinging
  # tests through BOTH backends so neither can rot while both exist.
  #
  # CRITICAL: every accelerated entry point returns None on any failure and the
  # caller silently falls back to Python (chamber_solver._native_chamber_pc,
  # closure.flows), so `pytest` alone can be a FALSE GREEN — everything runs on
  # Python and passes. The pre-flight positively proves the selected backend is
  # real, and ED_REQUIRE_ACCEL=1 turns a genuine accelerator failure into a raise
  # rather than a quiet fallback.
  accel-parity:
    name: Accelerator parity (ED_ACCEL=${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [numba, c]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies (CI subset — no rocketcea/gfortran)
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    - name: Verify committed CEA cache is present
      run: test -f output/cache/cea_cache_LOX_CH4_3D.npz

    # Positive proof the selected backend is real, not a silent Python fallback.
    # The C library is built in BOTH legs: the numba parity suite diffs numba
    # against C on identical inputs, so it needs the oracle present regardless of
    # which backend production is routed through.
    - name: Pre-flight — backend is genuinely available
      env:
        ED_ACCEL: ${{ matrix.backend }}
      run: |
        python -c "
        from engine.native.python import autobuild, ed_native, native_injector
        p = autobuild.ensure_lib(verbose=True)
        ed_native.load(p)
        assert native_injector.available(), 'native_injector.available() is False'
        print('C oracle built + ctypes-loaded OK:', p)
        import numba
        from engine import accel
        assert accel.available(), 'accel.available() is False (numba missing?)'
        assert accel.enabled(), 'accel.enabled() is False for ED_ACCEL=${{ matrix.backend }}'
        print('accel enabled, numba', numba.__version__)
        "

    # ED_REQUIRE_ACCEL=1 makes a genuine accelerator failure RAISE instead of
    # falling back, so this step cannot pass on the Python path and report a false
    # green. It proves the backend RAN; the numeric comparison is the next step.
    - name: Run impinging tests through ED_ACCEL=${{ matrix.backend }} (strict)
      env:
        ED_ACCEL: ${{ matrix.backend }}
        ED_REQUIRE_ACCEL: '1'
        ED_REQUIRE_NATIVE: '1'
      run: |
        python -m pytest \
          tests/test_layer1_impinging_vector.py \
          tests/test_flow_capacity_effective_area.py \
          --timeout=180 --timeout-method=thread -q

    # Live A/B numeric parity, run once (it is backend-independent: it calls the
    # numba kernels and the C kernel directly and diffs them, plus both against
    # the authoritative Python physics). Unlike the golden-vector C tests — frozen
    # snapshots that go stale when the PYTHON side changes — a live comparison
    # fails no matter which side drifted.
    #
    # test_accel_params_match_native_state asserts the pure-Python config->scalar
    # extraction reproduces the C EdEngineState EXACTLY; it is deleted with the C
    # tree, having done its job.
    - name: Live A/B parity — numba vs C vs Python on identical inputs (strict)
      if: matrix.backend == 'numba'
      env:
        ED_REQUIRE_ACCEL: '1'
        ED_REQUIRE_NATIVE: '1'
        ED_AB_PARITY: '1'
      run: |
        python -m pytest \
          tests/test_numba_ab_parity.py \
          tests/test_native_ab_parity.py \
          tests/test_accel_params_match_native_state.py \
          --timeout=300 --timeout-method=thread -v

  # Aggregate status, mirroring daq-server-ci.yml's build-summary.
  engine-design-summary:
    name: Engine Design Summary
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - backend-smoke
      - frontend
      - frontend-e2e
      - native-kernel
      - accel-parity
    if: always()

    steps:
    - name: Summary
      working-directory: .
      run: |
        echo "## Engine Design CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Python tests (gate) | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend smoke | ${{ needs.backend-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend build | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend E2E (Playwright) | ${{ needs.frontend-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Native kernel (C tests) | ${{ needs.native-kernel.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Accelerator parity (numba + C) | ${{ needs.accel-parity.result }} |" >> $GITHUB_STEP_SUMMARY

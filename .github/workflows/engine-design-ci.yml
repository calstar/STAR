name: Engine Design CI

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true, which breaks
# workflow triggers in some parsers (matches daq-server-ci.yml).
'on':
  push:
    paths:
      - 'EngineDesign/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/engine-design-ci.yml'
  pull_request:
    paths:
      - 'EngineDesign/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/engine-design-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: engine-design-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: EngineDesign

jobs:
  # Python regression gate. Fast (~seconds): no gfortran/rocketcea — the
  # CEA-backed configs load a committed cache table (output/cache/*.npz).
  python-tests:
    name: Python tests (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies (CI subset — no rocketcea/gfortran)
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    # EVERY propellant preset the UI exposes must ship a committed CEA cache, so
    # PintleEngineRunner loads (np.load) instead of falling through to a live
    # rocketcea build -- a multi-minute synchronous hang. This fast pre-flight
    # checks all of configs/propellants/*.yaml (not just the methalox table the
    # gate itself needs) and their metadata, and fails loudly before the heavy
    # suite. It is the guard that would have caught kerolox shipping cache-less.
    - name: Verify committed CEA caches are present (all presets)
      run: python -m pytest tests/test_cea_cache_presets.py -q

    # --timeout guards against any test accidentally triggering a live CEA
    # build (which would otherwise hang the runner). thread method so a stuck
    # C/Fortran call is still interrupted.
    - name: Run test gate
      run: |
        python -m pytest tests/ \
          --timeout=120 --timeout-method=thread \
          --durations=15 -q

  # Backend imports cleanly (FastAPI app + all routers load).
  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    - name: Import backend app
      run: python -c "import backend.main; print('backend.main imports OK')"

  # Frontend type-checks and builds (tsc -b && vite build). eslint runs as a
  # non-blocking signal: there is a backlog of pre-existing lint findings
  # (mostly no-explicit-any) that should be cleaned up but should not gate.
  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: EngineDesign/frontend/package-lock.json

    - name: Install dependencies
      working-directory: EngineDesign/frontend
      run: npm ci || npm install

    - name: TypeScript build
      working-directory: EngineDesign/frontend
      run: npm run build

    # Source audit: every control that edits the design must be gated on the
    # checkout. Blocking, unlike lint -- a control that escapes the gate looks
    # to the user like the design silently losing their work, which is the
    # failure this suite exists to prevent. Mirrors recovery-calculator's.
    - name: Unit tests (checkout gating audit)
      working-directory: EngineDesign/frontend
      run: npm test

    - name: ESLint (non-blocking — pre-existing backlog)
      working-directory: EngineDesign/frontend
      run: npm run lint
      continue-on-error: true

  # Browser E2E (Playwright). Playwright's webServer auto-boots the FastAPI
  # backend (ED_ACCEL=off -> pure Python) and Vite, so
  # this job just needs Python deps, node deps, and Chromium. The guard that
  # matters is connect-no-loop.spec.ts: it asserts idle /api/config/load traffic
  # settles instead of the ~7 req/s bootstrap fetch loop that hung the UI. tsc
  # does not catch that (the effect deps are "correct"); only a running app does.
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install backend dependencies (CI subset — no rocketcea/gfortran)
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    # The default config (methalox) loads its committed cache on backend boot;
    # a missing cache would fall through to a live build and hang the webServer.
    - name: Verify committed CEA caches are present (all presets)
      run: python -m pytest tests/test_cea_cache_presets.py -q

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: EngineDesign/frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: EngineDesign/frontend
      run: npm ci || npm install

    # ~/.cache/ms-playwright is NOT covered by setup-node's npm cache, so cache
    # the Chromium download (~115 MB) keyed on the lockfile.
    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('EngineDesign/frontend/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-

    - name: Install Playwright Chromium
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      working-directory: EngineDesign/frontend
      run: npx playwright install chromium

    # System libs for Chromium (apt) — not covered by the browser-binary cache,
    # so run every time (fast; a no-op when already present).
    - name: Install Playwright system dependencies
      working-directory: EngineDesign/frontend
      run: npx playwright install-deps chromium

    - name: Run Playwright E2E
      working-directory: EngineDesign/frontend
      run: npx playwright test

    - name: Upload Playwright traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-traces
        path: EngineDesign/frontend/test-results/
        if-no-files-found: warn
        retention-days: 7

  # Accelerator parity: the numba Layer-1 accelerator vs the authoritative Python
  # physics, diffed live on identical inputs.
  #
  # CRITICAL: every accelerated entry point returns None on any failure and the
  # caller silently falls back to Python (chamber_solver._accel_chamber_pc,
  # closure.flows), so `pytest` alone can be a FALSE GREEN — everything runs on
  # Python and passes. The pre-flight positively proves the accelerator is real,
  # and ED_REQUIRE_ACCEL=1 turns a genuine failure into a raise, not a quiet
  # fallback.
  accel-parity:
    name: Accelerator parity (numba vs Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        # Both: requirements-ci.txt only -r-includes the base list, so a change
        # to base would not otherwise invalidate the cache.
        cache-dependency-path: |
          EngineDesign/requirements-ci.txt
          EngineDesign/requirements-base.txt

    - name: Install dependencies (CI subset — no rocketcea/gfortran)
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements-ci.txt
        pip install -e ../lib/stardesign

    - name: Verify committed CEA cache is present
      run: test -f output/cache/cea_cache_LOX_CH4_3D.npz

    # Positive proof the accelerator is real, not a silent Python fallback.
    - name: Pre-flight — accelerator is genuinely available
      run: |
        python -c "
        import numba
        from engine import accel
        assert accel.available(), 'accel.available() is False (numba missing?)'
        assert accel.enabled(), 'accel.enabled() is False'
        print('accel enabled, numba', numba.__version__)
        "

    # ED_REQUIRE_ACCEL=1 makes a genuine accelerator failure RAISE instead of
    # falling back, so this step cannot pass on the Python path and report a false
    # green. It proves the backend RAN; the numeric comparison is the next step.
    #
    # test_accel_is_actually_used closes a different false-green: every other check
    # proves the accelerator WORKS, none proves production still CALLS it. With the
    # accel.evaluate call removed from Layer-1's _eval_candidate, all of them stay
    # green while the optimizer silently runs ~120x slower on Python. That test
    # asserts the real call sites are reached, and is mutation-verified against
    # both the Layer-1 and chamber_solver/closure seams.
    - name: Run impinging tests through the accelerator (strict)
      env:
        ED_ACCEL: 'numba'
        ED_REQUIRE_ACCEL: '1'
      run: |
        python -m pytest \
          tests/test_layer1_impinging_vector.py \
          tests/test_flow_capacity_effective_area.py \
          tests/test_accel_is_actually_used.py \
          tests/test_accel_outcomes.py \
          --timeout=180 --timeout-method=thread -q

    # Live A/B numeric parity: run the accelerator and the authoritative Python
    # physics on the same inputs and diff them field by field. A live comparison
    # fails no matter which side drifted — unlike a frozen snapshot, which goes
    # stale silently when the Python side changes.
    - name: Live A/B parity — numba vs Python on identical inputs (strict)
      env:
        ED_REQUIRE_ACCEL: '1'
        ED_AB_PARITY: '1'
      run: |
        python -m pytest \
          tests/test_numba_ab_parity.py \
          --timeout=300 --timeout-method=thread -v

  # Aggregate status, mirroring daq-server-ci.yml's build-summary.

  # Docker images build. This is the gate that was missing: publish-apps.yml
  # only triggers on push to main, so a Dockerfile that no longer matches the
  # tree -- e.g. a COPY of a directory the branch deleted -- got its first real
  # build *after* the merge, and broke the deploy image instead of the PR.
  #
  # Same Dockerfiles, same root context as publish-apps.yml, but push: false --
  # this proves the image builds, it does not publish anything. cache-from
  # points at publish-apps' scopes so PRs reuse main's layers; nothing is
  # written back (GitHub isolates branch caches from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine-design-api,      context: ., dockerfile: ./EngineDesign/Dockerfile.api }
          - { name: engine-design-frontend, context: ., dockerfile: ./EngineDesign/frontend/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          # Repo root, matching publish-apps.yml: these images copy several
          # EngineDesign/ subtrees plus lib/stardesign.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  engine-design-summary:
    name: Engine Design Summary
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - backend-smoke
      - frontend
      - frontend-e2e
      - accel-parity
      - docker-image
    if: always()

    steps:
    - name: Summary
      working-directory: .
      run: |
        echo "## Engine Design CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Python tests (gate) | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend smoke | ${{ needs.backend-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend build | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend E2E (Playwright) | ${{ needs.frontend-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Accelerator parity (numba vs Python) | ${{ needs.accel-parity.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker images (build, no push) | ${{ needs.docker-image.result }} |" >> $GITHUB_STEP_SUMMARY

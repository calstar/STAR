name: Auth CI

# auth/ carries real logic now -- the login roster that the design tools share
# against (auth/users.py) -- so its test suite needs to actually run somewhere.
# publish-auth.yml only builds and pushes the image; it asserts nothing.

'on':
  push:
    paths:
      - 'auth/**'
      - '.github/workflows/auth-ci.yml'
  pull_request:
    paths:
      - 'auth/**'
      - '.github/workflows/auth-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: auth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: auth/requirements-dev.txt

    - name: Install dependencies
      working-directory: auth
      run: pip install -r requirements-dev.txt

    - name: Run tests
      working-directory: auth
      # The module reads these at import time; the values are irrelevant to the
      # tests, which sign their own tokens with main.JWT_SECRET.
      env:
        FLASK_SECRET_KEY: ci-flask-secret-0123456789abcdef
        JWT_SECRET: ci-jwt-secret-0123456789abcdefghij
        GOOGLE_CLIENT_ID: ci-client-id
        GOOGLE_CLIENT_SECRET: ci-client-secret
      run: python -m pytest test_main.py -q

  # Docker image build. This is the gate that was missing: publish-apps.yml (and
  # publish-auth.yml) only trigger on push to main, so a Dockerfile that no
  # longer matches the tree -- a COPY of a directory the branch deleted, say --
  # got its first real build *after* the merge, and broke the deploy image
  # instead of the PR. That is exactly how EngineDesign/Dockerfile.api broke
  # main when PR #37 deleted engine/native.
  #
  # Same Dockerfile and context as the publisher, but push: false: this proves
  # the image builds, publishes nothing, and needs no GHCR login. cache-from
  # points at the publisher's cache scope so PRs reuse main's layers; nothing is
  # written back (GitHub isolates a branch's cache from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth, context: ./auth, dockerfile: ./auth/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha

name: PR comments to Discord

# Every comment and review on a pull request is posted to the team's Discord
# channel through a webhook (.github/scripts/pr-comment-to-discord.mjs).
#
# Setup (once, by a repo admin): in Discord, channel settings -> Integrations ->
# Webhooks -> New Webhook, copy its URL; in GitHub, Settings -> Secrets and
# variables -> Actions -> New repository secret DISCORD_PR_WEBHOOK_URL. Until
# it is set, runs log what they would have posted and pass.
#
# Comments on PRs from forks: GitHub withholds secrets from
# pull_request_review* runs triggered there, so only conversation comments on
# those post. The team's PRs are branches of this repo, which post everything.

'on':
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# The webhook is the only credential this needs; the GitHub token gets nothing.
permissions: {}

concurrency:
  # One at a time per PR, in order, so a burst of review comments posts in the
  # order they were written. Never cancelled: each run is one message.
  group: pr-comments-discord-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    name: Post to Discord
    # issue_comment fires for plain issues too; only PR conversations count.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch's copy of the script, never the PR's: a PR can't
      # change the code that runs with the webhook secret.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
        run: node .github/scripts/pr-comment-to-discord.mjs

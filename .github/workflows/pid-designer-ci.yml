name: P&ID Designer CI

'on':
  push:
    paths:
      - 'pid-designer/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/pid-designer-ci.yml'
  pull_request:
    paths:
      - 'pid-designer/**'
      # The shared design core: its permission check is what stops one user
      # editing another's designs, so a change to it has to run these tests.
      - 'lib/stardesign/**'
      - '.github/workflows/pid-designer-ci.yml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: pid-designer/frontend/package-lock.json

    - name: Install dependencies
      working-directory: pid-designer/frontend
      run: npm ci || npm install

    - name: TypeScript build
      working-directory: pid-designer/frontend
      run: npm run build

    # Guards what actually reaches the server when a diagram is saved: ReactFlow
    # decorates nodes with view state (selected/dragging/measured), and storing
    # it meant a plain click rewrote the diagram.
    - name: Unit tests
      working-directory: pid-designer/frontend
      run: npm test

  backend:
    name: Backend (imports + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: pid-designer/requirements.txt

    - name: Install dependencies
      working-directory: pid-designer
      # The design core shared across the three design tools. Installed
      # from a path, not published -- it is versioned with the repo.
      run: |
        pip install -r requirements.txt
        pip install -e ../lib/stardesign

    - name: Verify imports
      working-directory: pid-designer
      run: python3 -c "import backend.main; print('backend imports OK')"

    # An import check was enough while a diagram could only be reached from its
    # owner's own folder. Now that ?owner= can reach someone else's, the access
    # matrix in tests/test_diagrams.py is what stops a route shipping without
    # its permission check.
    - name: Install test dependencies
      working-directory: pid-designer
      # pytest-timeout because the checkout tests fork real processes to prove
      # two people cannot hold one diagram; a regression there should fail the
      # job, not hang it.
      run: pip install pytest pytest-timeout httpx

    - name: Run tests
      working-directory: pid-designer
      run: python -m pytest tests -q --timeout=120 --timeout-method=thread

  # Docker image build. This is the gate that was missing: publish-apps.yml (and
  # publish-auth.yml) only trigger on push to main, so a Dockerfile that no
  # longer matches the tree -- a COPY of a directory the branch deleted, say --
  # got its first real build *after* the merge, and broke the deploy image
  # instead of the PR. That is exactly how EngineDesign/Dockerfile.api broke
  # main when PR #37 deleted engine/native.
  #
  # Same Dockerfile and context as the publisher, but push: false: this proves
  # the image builds, publishes nothing, and needs no GHCR login. cache-from
  # points at the publisher's cache scope so PRs reuse main's layers; nothing is
  # written back (GitHub isolates a branch's cache from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pid-designer-api,      context: ., dockerfile: ./pid-designer/Dockerfile.api }
          - { name: pid-designer-frontend, context: ., dockerfile: ./pid-designer/frontend/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

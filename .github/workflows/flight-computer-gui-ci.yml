name: Flight Computer GUI CI

on:
  push:
    paths:
      - 'Test-GUI/FlightComputer-GUI/**'
      - 'firmware/Flight_Computer/src/app/emmc_log.*'
      - 'firmware/Flight_Computer/src/app/flight_state.*'
      - 'firmware/Flight_Computer/src/app/self_test_*.h'
      - 'firmware/Flight_Computer/src/app/records.h'
      - '.github/workflows/flight-computer-gui-ci.yml'
  pull_request:
    paths:
      - 'Test-GUI/FlightComputer-GUI/**'
      - 'firmware/Flight_Computer/src/app/emmc_log.*'
      - 'firmware/Flight_Computer/src/app/flight_state.*'
      - 'firmware/Flight_Computer/src/app/self_test_*.h'
      - 'firmware/Flight_Computer/src/app/records.h'
      - '.github/workflows/flight-computer-gui-ci.yml'

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The app ships to team laptops: macOS (Apple silicon) and Windows.
        # Linux is where it is developed, and where the browser tests run.
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    defaults:
      run:
        working-directory: Test-GUI/FlightComputer-GUI
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Test-GUI/FlightComputer-GUI

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Test-GUI/FlightComputer-GUI/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Type-checks the window and builds it into dist/, which the Tauri crate embeds.
      - name: Window (TypeScript)
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Unit tests (protocol, config, LoRa, records, eMMC decoding, the simulated
      # board, the backend's rules), the firmware-writer test (the firmware's own
      # emmc_log.c, compiled with the runner's C compiler; required where one is
      # always present), and the backend headless against the simulated board.
      - name: Test
        env:
          FC_REQUIRE_FIRMWARE_TEST: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: cargo test --locked

      # The window in Chromium against the real backend and simulated board.
      - name: Browser tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Installer
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: star-fc-gui-${{ runner.os }}
          path: |
            Test-GUI/FlightComputer-GUI/target/release/bundle/deb/*.deb
            Test-GUI/FlightComputer-GUI/target/release/bundle/dmg/*.dmg
            Test-GUI/FlightComputer-GUI/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

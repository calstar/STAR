name: DAQ Server CI/CD

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true, which breaks workflow triggers in some parsers.
'on':
  push:
    # main only. Without a branch filter, pushing to a branch with an open PR
    # fires push AND pull_request, running this whole workflow twice on the same
    # commit — doubling both runner cost and the odds of a flaky red check.
    branches: [main]
    paths:
      - 'daq-server/**'
      - '.github/workflows/daq-server-ci.yml'
  pull_request:
    paths:
      - 'daq-server/**'
      - '.github/workflows/daq-server-ci.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref: this workflow does a full C++ build
# plus an 11-process stack plus Chromium, so stacking pushes is expensive.
concurrency:
  group: daq-server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: daq-server

env:
  BUILD_DIR: build
  CXX_STANDARD: 20

jobs:
  # Format check - must pass before building
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Install clang-format from the official LLVM apt repo so CI matches modern
    # macOS/Linux dev environments. Ubuntu's default `clang-format` package is
    # v18; designated-initializer formatting changed between v18 and v19, which
    # produced false-positive format failures on code that's clean on developer
    # laptops. Pinning to 19 keeps CI and local in sync.
    #
    # We use a /usr/local/bin/ symlink (not update-alternatives) because
    # update-alternatives priorities can get out-shouted by Ubuntu's stock
    # clang-format package. /usr/local/bin/ comes before /usr/bin/ on the
    # default $PATH, so the symlink wins unconditionally.
    - name: Install clang-format 19 (LLVM apt repo)
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-format-19
        sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format
        # Verify: this should print "Ubuntu clang-format version 19.x.x"
        clang-format --version
        which clang-format

    # format.sh also runs `black --check` on Python under firmware/.
    # --user avoids PEP 668 ("externally-managed-environment") on Ubuntu 22.04+.
    #
    # Pinned to 25.11.0 because: developer laptops with system Python 3.9 (macOS
    # default) can't install black 26.x (requires Python ≥3.10). Pinning here
    # keeps CI in sync with laptops until everyone has a newer Python.
    - name: Install black
      run: |
        pip install --user black==25.11.0
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Check code formatting
      working-directory: .
      run: |
        chmod +x ./format.sh
        if ! ./format.sh --check; then
          echo "::error::Code formatting check failed. Run './format.sh' from the repo root to fix."
          exit 1
        fi
      continue-on-error: false

  web-gui:
    name: Web GUI (Vitest + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: daq-server/diablo_server/frontend/package-lock.json

    # Frontend imports ../backend/src/* (shared types/config); install backend so module resolution works.
    - name: Install backend dependencies
      working-directory: daq-server/diablo_server/backend
      run: npm ci || npm install

    - name: Install frontend dependencies
      working-directory: daq-server/diablo_server/frontend
      run: npm ci || npm install

    # shared/types.js is a committed runtime artifact (prod backend does
    # `await import('../../shared/types.js')`; Vite bundles the literal .js).
    # Regenerate it from types.ts and fail if the checked-in copy drifted —
    # a stale copy silently ships an undefined enum member to the frontend.
    - name: Verify shared types are in sync
      working-directory: daq-server/diablo_server/frontend
      run: |
        npm run build:shared
        git diff --exit-code -- ../shared/types.js ../shared/types.d.ts ../shared/types.js.map ../shared/types.d.ts.map \
          || { echo "::error::shared/types.* is stale — run 'npm run build:shared' in frontend/ and commit the result."; exit 1; }

    - name: Run backend unit tests
      working-directory: daq-server/diablo_server/backend
      run: npm run test

    - name: Run frontend unit tests
      working-directory: daq-server/diablo_server/frontend
      run: npm run test

    - name: Verify Vite build
      working-directory: daq-server/diablo_server/frontend
      run: npm run test:build

  # Build with multiple compilers (Release only)
  build:
    name: Build (${{ matrix.compiler }} — Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, clang-18]
        include:
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          ccache \
          libeigen3-dev \
          pkg-config \
          ${{ matrix.cc }} \
          ${{ matrix.cxx }}

    - name: Install optional dependencies (CAN — best effort)
      run: |
        sudo apt-get install -y libcanard-dev || echo "libcanard-dev not in apt; building without CAN package"

    # Clang + libstdc++ from the default system GCC (e.g. 14 on ubuntu-latest) can blow up in C++20 <format>/ranges
    # included from <chrono>. Install g++-12 and pin Clang to that libstdc++ with --gcc-install-dir.
    - name: Install GCC 12 libstdc++ for Clang
      if: startsWith(matrix.compiler, 'clang-')
      run: sudo apt-get install -y g++-12

    - name: Restore compiler cache (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ hashFiles('daq-server/CMakeLists.txt', 'daq-server/diablo_server/CMakeLists.txt', 'daq-server/archive/legacy/utl/**/*.cpp', 'daq-server/archive/legacy/utl/**/*.hpp', 'daq-server/diablo_server/**/*.cpp', 'daq-server/diablo_server/**/*.hpp') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.compiler }}-

    - name: Show ccache stats (before)
      run: ccache -s || true

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        cd ${{ env.BUILD_DIR }}
        case "${{ matrix.compiler }}" in
          clang-*)
            export CXXFLAGS="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/12"
            ;;
        esac
        cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
          -G Ninja \
          ..

    - name: Build project
      run: |
        cd ${{ env.BUILD_DIR }}
        cmake --build . --parallel $(nproc)

    - name: Show ccache stats (after)
      run: ccache -s || true

    - name: Verify executables
      run: |
        cd ${{ env.BUILD_DIR }}
        echo "Checking for built executables..."
        find bin/ -type f -executable | head -10 || true

    # Every binary and shared library, not a hand-picked subset: integration-test
    # and playwright-guitest-e2e consume this instead of each doing their own cold
    # C++ build, and they launch the whole stack (calibration, heartbeat, config
    # broadcast, controller, sequencer, OTA). A partial list here reintroduces the
    # stale/missing-binary class of failure the test scripts exist to prevent.
    - name: Upload build artifacts
      if: matrix.compiler == 'gcc-12'
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.compiler }}-Release
        path: |
          daq-server/${{ env.BUILD_DIR }}/bin/
          daq-server/${{ env.BUILD_DIR }}/lib/
        retention-days: 7

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME/HACK comments..."
        TODOS=$(grep -r "TODO\|FIXME\|HACK\|XXX" \
          --include="*.cpp" \
          --include="*.hpp" \
          --include="*.c" \
          --include="*.h" \
          diablo_server/ archive/legacy/utl/ || true)
        if [ -n "$TODOS" ]; then
          echo "::warning::Found TODO/FIXME/HACK comments:"
          echo "$TODOS"
        else
          echo "✅ No TODO/FIXME/HACK comments found"
        fi

    - name: Config TOML has no underscore-separated numbers
      run: python3 test/check_toml_no_underscore_ints.py

    - name: Check for large files
      run: |
        echo "Checking for large files..."
        find . -type f -size +1M -not -path "./.git/*" -not -path "./build/*" -not -path "./external/*" | \
        while read file; do
          echo "::warning::Large file detected: $file ($(du -h "$file" | cut -f1))"
        done || true

    - name: Check for missing includes
      run: |
        echo "Checking for common include issues..."
        if grep -r "#include <iostream>" --include="*.cpp" --include="*.hpp" diablo_server/ archive/legacy/utl/ | \
           grep -v "#include <iostream>" | head -5; then
          echo "::warning::Potential missing includes detected"
        fi
      continue-on-error: true

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip

    - name: Install security tools
      run: |
        pip3 install --user semgrep bandit
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Run semgrep security scan
      run: |
        if command -v semgrep &> /dev/null; then
          echo "Running semgrep security scan..."
          semgrep \
            --config=auto \
            --exclude="external/" \
            --exclude="build/" \
            --exclude=".cache/" \
            --json \
            --output=semgrep-report.json \
            . || true
        else
          echo "Semgrep not available, skipping"
        fi
      continue-on-error: true

    - name: Upload semgrep results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-report
        path: daq-server/semgrep-report.json

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential hardcoded secrets..."
        SECRETS=$(grep -riE "(password|secret|key|token|api_key|apikey)\s*=\s*['\"][^'\"]+['\"]" \
          --include="*.cpp" \
          --include="*.hpp" \
          --include="*.py" \
          --include="*.sh" \
          diablo_server/ archive/legacy/utl/ scripts/ || true)
        if [ -n "$SECRETS" ]; then
          echo "::warning::Potential hardcoded secrets found:"
          echo "$SECRETS"
        else
          echo "✅ No obvious hardcoded secrets found"
        fi

    - name: Check for dangerous functions
      run: |
        echo "Checking for potentially unsafe C functions..."
        UNSAFE=$(grep -rE "\b(strcpy|sprintf|gets|scanf|strcat)\s*\(" \
          --include="*.cpp" \
          --include="*.hpp" \
          diablo_server/ archive/legacy/utl/ || true)
        if [ -n "$UNSAFE" ]; then
          echo "::warning::Potentially unsafe C functions found:"
          echo "$UNSAFE"
        else
          echo "✅ No unsafe C functions detected"
        fi

  # Run tests
  # ThreadSanitizer over the sequencer's concurrency tests.
  #
  # This exists because the bug it guards is invisible to every other job here. The sequencer had
  # two threads running the same multi-step transition sequence (a TCP client thread and
  # FireManager's expiry thread), which double-joined the actuator republish thread. A plain -O2
  # build does NOT reliably crash on that — a pre-fix binary survived 1016 commands over 65 s,
  # because glibc tolerates a double pthread_join often enough to hide it. Under TSan the same
  # code dies in 0.2 s at ~50 commands with a CHECK failure inside pthread_join.
  #
  # The Release ctest job cannot see this, and no static analyser runs here any more.
  # Without this job the fix is unverified against regression.
  thread-sanitizer:
    name: ThreadSanitizer (sequencer)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build libeigen3-dev pkg-config gcc-12 g++-12 util-linux

    - name: Build with -fsanitize=thread
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        cmake -S . -B build-tsan \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=gcc-12 \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -G Ninja
        cmake --build build-tsan --parallel $(nproc) \
          --target test_sequencer_concurrency test_abort_ordering

    # Two things that will waste an afternoon if they are not spelled out:
    #
    #  1. `setarch -R` disables ASLR. Without it TSan aborts at startup on modern kernels with
    #     "FATAL: ThreadSanitizer: unexpected memory mapping" before running a single line.
    #
    #  2. The failure mode is a sanitizer CHECK abort (a non-zero exit), NOT a
    #     "WARNING: ThreadSanitizer" data-race report. Gate on the exit code. Grepping the log for
    #     "WARNING" would pass straight over the exact regression this job exists to catch.
    # daq-server/build-tsan, not build-tsan: a step-level working-directory REPLACES
    # defaults.run.working-directory rather than nesting under it, so the bare name resolved to
    # $GITHUB_WORKSPACE/build-tsan while the build step (which used the default) had created
    # daq-server/build-tsan. The job failed with "No such file or directory" before running a
    # single test, which means the regression this job exists to catch was never actually guarded.
    - name: Run concurrency tests under TSan
      working-directory: daq-server/build-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1 history_size=7
      run: |
        setarch -R ./bin/test_sequencer_concurrency
        setarch -R ./bin/test_abort_ordering

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libeigen3-dev \
          pkg-config \
          gcc-12 \
          g++-12 \
          python3 \
          python3-pip

    - name: Install Python test dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip3 install -r requirements.txt
        fi

    - name: Build project
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        cd ${{ env.BUILD_DIR }}
        cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-12 \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
          -G Ninja \
          ..
        cmake --build . --parallel $(nproc)

    # Strict since enable_testing() ordering was fixed — ctest now registers real
    # tests (board_clock_sync); a failure here must fail the job.
    - name: Run CTest tests
      run: |
        cd ${{ env.BUILD_DIR }}
        ctest --output-on-failure --parallel $(nproc)

    - name: Run Sequencer Elodin Unit Test
      run: |
        cd ${{ env.BUILD_DIR }}
        ./bin/test_sequencer_elodin

    - name: Run BoardClockSync Unit Test
      run: |
        cd ${{ env.BUILD_DIR }}
        ./bin/test_board_clock_sync

    # Ethernet OTA flash wire-format test: drives the real ota_service binary
    # against a loopback fake board (no hardware). Guards the espota handshake
    # (big-endian size header, 4 KB chunk streaming, OK/silent-reboot/ERR paths)
    # that a real ESP32-S3 depends on. Strict — a regression here must fail the job.
    - name: Run OTA fake-board test
      env:
        OTA_SERVICE_BIN: ${{ env.BUILD_DIR }}/bin/ota_service
      run: python3 test/test_ota_flash.py

    - name: Run Python smoke tests (allowlist only)
      run: |
        if [ -d "test" ]; then
          echo "Running allowlisted Python smoke tests..."
          # Keep this list intentionally small and non-interactive.
          # Add paths here only for deterministic, CI-safe scripts.
          PY_TESTS=(
          )

          if [ ${#PY_TESTS[@]} -eq 0 ]; then
            echo "No allowlisted Python smoke tests configured; skipping."
          fi

          for t in "${PY_TESTS[@]}"; do
            if [ -f "$t" ]; then
              echo "Running $t"
              timeout 60s python3 "$t" || echo "::warning::Python smoke test failed/timed out: $t"
            else
              echo "::warning::Allowlisted Python test not found: $t"
            fi
          done
        fi
      continue-on-error: true

    - name: Run integration tests
      run: |
        if [ -f "test/test_system.sh" ]; then
          chmod +x test/test_system.sh
          # Only run quick smoke tests in CI
          echo "Running smoke tests..."
        fi
      continue-on-error: true

  # ASan + UBSan over the full stack.
  #
  # Sanitizers only report on code that actually executes, which is why this job runs
  # test_integration.sh rather than ctest. Measured both ways before adding it: all 10 ctest tests
  # pass under ASan/UBSan with zero findings, while one integration run — which drives real UDP
  # through every service — reported five misaligned u32 stores in config_broadcast and, in
  # daq_bridge, a bool loaded as 212 out of a DiscoveredBoard whose max_sensors/active_sensors were
  # equally uninitialised and get serialised straight into the generated board config. A
  # ctest-only sanitizer job would have found none of that.
  #
  # Three things that will waste an afternoon if they are not spelled out:
  #
  #  1. `setarch -R` disables ASLR. Without it the sanitizer aborts at startup on modern kernels
  #     with "unexpected memory mapping" before running a line. Same trap as the TSan job.
  #
  #  2. UBSan's non-fatal diagnostics go to each service's OWN stderr, which the harness redirects
  #     into .tmp/integration_*.log. They do NOT reach this job's stdout, and `log_path` does not
  #     capture them either. So the script exiting 0 proves nothing — the logs are the result, and
  #     the grep below is what actually gates the job.
  #
  #  3. detect_leaks=0 on purpose: these are long-running services killed at teardown, so LSan
  #     reports at exit would bury the memory-error signal this job exists for.
  #
  # The sensor rate is pinned to 5 Hz for the same reason the integration job pins it, only harder:
  # ASan roughly halves throughput and the harness asserts >=97% frontend broadcast delivery, and at
  # full rate under ASan a local run measured 96.8% and failed on that alone. Do not lower it
  # further to buy headroom — 3 Hz was tried and the harness then failed the opposite assertion,
  # median stream spacing 1005 ms against its 5-1000 ms window. 5 is the floor that satisfies both.
  address-sanitizer:
    name: ASan + UBSan (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      INTEGRATION_SENSOR_HZ: '5'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build libeigen3-dev pkg-config \
          gcc-12 g++-12 python3 python3-pip util-linux

    - name: Install elodin-db
      run: |
        ELODIN_VERSION="v0.16.1"
        ELODIN_DB_INSTALLER_URL="https://github.com/elodin-sys/elodin/releases/download/${ELODIN_VERSION}/elodin-db-installer.sh"
        mkdir -p "$HOME/.cargo/bin"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -LsSf "$ELODIN_DB_INSTALLER_URL" | sh

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    # -DSANITIZE=ON also forces CMAKE_POSITION_INDEPENDENT_CODE: daqv2_comms is a static library
    # linked into a shared one, and ASan's __asan_option_detect_stack_use_after_return reference
    # fails to relocate without PIC (a hard link error, not a warning).
    - name: Build with -fsanitize=address,undefined
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        cmake -S . -B ${{ env.BUILD_DIR }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=gcc-12 \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
          -DSANITIZE=ON \
          -G Ninja
        cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

    - name: Install backend dependencies
      run: cd diablo_server/backend && npm install

    - name: Install Python dependencies
      run: pip3 install tomli || true

    - name: Run integration test under ASan/UBSan
      env:
        SKIP_CPP_BUILD: '1'
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:halt_on_error=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
      run: setarch -R bash test/test_integration.sh

    # This step, not the one above, is the gate. See note 2 in the job comment.
    - name: Fail on any sanitizer report
      if: always()
      run: |
        shopt -s nullglob
        hits=0
        for f in .tmp/integration_*.log; do
          if grep -qE "runtime error:|ERROR: AddressSanitizer|ERROR: LeakSanitizer" "$f"; then
            echo "::error::sanitizer report in $(basename "$f")"
            grep -nE "runtime error:|ERROR: AddressSanitizer|ERROR: LeakSanitizer" "$f" | head -40
            hits=1
          fi
        done
        if [ "$hits" != "0" ]; then
          echo "Sanitizer findings above. Full logs are in the uploaded artifact."
          exit 1
        fi
        echo "✅ no sanitizer reports across $(ls .tmp/integration_*.log 2>/dev/null | wc -l) service log(s)"

    # include-hidden-files is required, not optional: .tmp is a dotted directory and
    # upload-artifact v4 silently excludes hidden paths by default, so the first run of this
    # job uploaded nothing while the gate above was reading 11 logs from that same path.
    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: asan-service-logs
        path: daq-server/.tmp/integration_*.log
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: warn

  # Full-stack integration test
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 25

    # Uniform 5 Hz instead of production 10 Hz / 50 Hz-encoder. A 4-core runner
    # starves on an 11-process stack, and that starvation — not any defect — was
    # the dominant source of false failures. Unset locally, where full rate runs.
    # Keep >= points_per_second (4) or envelope downsampling stops being tested.
    env:
      INTEGRATION_SENSOR_HZ: '5'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build libeigen3-dev pkg-config \
          gcc-12 g++-12 python3 python3-pip

    - name: Install elodin-db
      run: |
        ELODIN_VERSION="v0.16.1"
        # elodin-installer.sh installs the `elodin` CLI only; integration needs `elodin-db`.
        ELODIN_DB_INSTALLER_URL="https://github.com/elodin-sys/elodin/releases/download/${ELODIN_VERSION}/elodin-db-installer.sh"

        mkdir -p "$HOME/.cargo/bin"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"

        curl --proto '=https' --tlsv1.2 -LsSf "$ELODIN_DB_INSTALLER_URL" | sh

    - name: Verify elodin-db is on PATH
      run: |
        command -v elodin-db
        elodin-db --help >/dev/null

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    # Reuse the `build` job's Release output instead of compiling again. Same
    # binaries this job built for itself before (it already used Release), just
    # without paying for the compile a second time. upload-artifact does not
    # preserve the executable bit, so restore it.
    - name: Download C++ binaries from build job
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-gcc-12-Release
        path: daq-server/${{ env.BUILD_DIR }}
    - name: Restore executable bits
      run: |
        chmod +x "${BUILD_DIR}/bin/"* || true
        ls -l "${BUILD_DIR}/bin/"

    - name: Install backend dependencies
      run: |
        cd diablo_server/backend && npm install

    - name: Install Python dependencies
      run: |
        pip3 install tomli || true

    # WebSocket / stack checks only. Browser E2E runs in job playwright-guitest-e2e (full guitest stack).
    - name: Run integration test
      env:
        SKIP_CPP_BUILD: '1'   # binaries came from the build job above
      run: |
        bash test/test_integration.sh

  # Full guitest stack + Playwright (same as local: bash test/e2e_guitest_playwright.sh)
  playwright-guitest-e2e:
    name: Playwright E2E (guitest stack)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45

    # Same reasoning as integration-test above, plus Chromium on the same 4 cores.
    env:
      SIM_SENSOR_HZ: '5'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Chromium's own libs are already on ubuntu-latest; only the font packages
    # are genuinely missing, so they go in this existing apt call rather than
    # `playwright install --with-deps`, which re-ran apt-get update every build
    # to install the same nine packages.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build libeigen3-dev pkg-config \
          gcc-12 g++-12 python3 python3-pip tmux \
          fonts-freefont-ttf fonts-ipafont-gothic fonts-unifont \
          fonts-wqy-zenhei fonts-liberation fonts-noto-color-emoji

    # Pinned version, so a cache hit skips the download entirely.
    - name: Cache elodin-db
      id: cache-elodin
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/elodin-db
        key: ${{ runner.os }}-elodin-db-v0.16.1

    - name: Install elodin-db
      if: steps.cache-elodin.outputs.cache-hit != 'true'
      run: |
        ELODIN_VERSION="v0.16.1"
        ELODIN_DB_INSTALLER_URL="https://github.com/elodin-sys/elodin/releases/download/${ELODIN_VERSION}/elodin-db-installer.sh"
        mkdir -p "$HOME/.cargo/bin"
        export PATH="$HOME/.cargo/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -LsSf "$ELODIN_DB_INSTALLER_URL" | sh

    - name: Put elodin-db on PATH
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        chmod +x "$HOME/.cargo/bin/elodin-db"

    - name: Verify elodin-db is on PATH
      run: command -v elodin-db && elodin-db --help >/dev/null

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: daq-server/diablo_server/frontend/package-lock.json

    # Reuse the build job's Release output rather than compiling in this job.
    # Note this job previously ran the unoptimized default build via build.sh;
    # these are optimized, which should also ease the CPU contention that has
    # been starving the stack on 4-core runners.
    - name: Download C++ binaries from build job
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-gcc-12-Release
        path: daq-server/${{ env.BUILD_DIR }}
    - name: Restore executable bits
      run: |
        chmod +x "${BUILD_DIR}/bin/"* || true
        ls -l "${BUILD_DIR}/bin/"

    - name: Install backend dependencies
      run: cd diablo_server/backend && (npm ci || npm install)

    - name: Install frontend dependencies
      run: cd diablo_server/frontend && (npm ci || npm install)

    # ~/.cache/ms-playwright is NOT covered by setup-node's npm cache, so
    # Chromium (~150 MB) was re-downloaded on every run.
    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('daq-server/diablo_server/frontend/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-

    - name: Install Playwright Chromium
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: cd diablo_server/frontend && npx playwright install chromium

    - name: Install Python dependencies (sim / config)
      run: pip3 install tomli || pip3 install --user tomli || true

    # test/e2e_guitest_playwright.sh runs USE_SIM=1 scripts/build.sh then starts the stack (tmux or fallback).
    - name: Run Playwright guitest E2E
      env:
        CC: gcc-12
        CXX: g++-12
        SKIP_CPP_BUILD: '1'          # binaries came from the build job above
        SKIP_PLAYWRIGHT_INSTALL: '1' # browser installed/cached in its own step
      run: bash test/e2e_guitest_playwright.sh

    # Stack pane logs + Playwright traces are the only way to diagnose
    # "boards DISCONNECTED / no sim data" class failures after the runner dies.
    - name: Upload stack logs and Playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-diagnostics
        path: |
          /tmp/gui_logs/
          daq-server/diablo_server/frontend/test-results/
        if-no-files-found: warn
        retention-days: 7

  # Session-control end-to-end on the SAME systemd path the server uses (sim
  # overlay). First CI coverage of SESSION_SERVICE_MODE=systemd — the session
  # button starting/stopping the real pipeline, auto-stop warnings, auto-stop,
  # Discard cleanup, Save + extend. The rest of CI only exercises `off` mode.
  session-systemd-e2e:
    name: Session Control E2E (systemd)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 25

    # Uniform low sim rate — same 4-core-runner reasoning as integration-test.
    env:
      SIM_SENSOR_HZ: '5'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip libeigen3-dev

    - name: Cache elodin-db
      id: cache-elodin
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/elodin-db
        key: ${{ runner.os }}-elodin-db-v0.16.1

    - name: Install elodin-db
      if: steps.cache-elodin.outputs.cache-hit != 'true'
      run: |
        ELODIN_DB_INSTALLER_URL="https://github.com/elodin-sys/elodin/releases/download/v0.16.1/elodin-db-installer.sh"
        mkdir -p "$HOME/.cargo/bin"
        export PATH="$HOME/.cargo/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -LsSf "$ELODIN_DB_INSTALLER_URL" | sh

    - name: Put elodin-db on PATH
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        chmod +x "$HOME/.cargo/bin/elodin-db"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    # Reuse the build job's Release binaries (upload-artifact drops the +x bit).
    - name: Download C++ binaries from build job
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-gcc-12-Release
        path: daq-server/${{ env.BUILD_DIR }}
    - name: Restore executable bits
      run: chmod +x "${BUILD_DIR}/bin/"* || true

    - name: Install backend dependencies
      run: cd diablo_server/backend && (npm ci || npm install)

    - name: Install Python dependencies (sim / config)
      run: pip3 install tomli || pip3 install --user tomli || true

    # systemd --user units run with a fixed PATH (…:/usr/local/bin:/usr/bin:…)
    # and sensor-backend hardcodes /usr/bin/npm — neither sees setup-node's
    # hostedtoolcache node. Expose node/npm/npx where the units look.
    - name: Expose node/npm/npx to systemd units
      run: |
        sudo ln -sf "$(command -v node)" /usr/local/bin/node
        sudo ln -sf "$(command -v npm)"  /usr/bin/npm
        sudo ln -sf "$(command -v npx)"  /usr/local/bin/npx
        /usr/bin/npm --version

    # Bring a user systemd instance to life (GitHub runners have no login
    # session by default): enable-linger starts user@<uid>.service; wait for its
    # bus. This is the one piece the server/laptop already have for free.
    - name: Start user systemd instance
      run: |
        echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        sudo loginctl enable-linger "$USER"
        for _ in $(seq 1 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
        systemctl --user show-environment >/dev/null || { echo "::error::systemctl --user not available"; exit 1; }
        echo "user systemd is up"

    - name: Run session-control E2E
      run: bash test/test_session.sh

    - name: Capture journals on failure
      if: failure()
      run: |
        mkdir -p /tmp/session_logs
        for u in sensor-backend sensor-elodin sensor-daq sensor-calibration \
                 sensor-controller sensor-actuator sensor-simulator \
                 sensor-config-broadcast sensor-heartbeat; do
          journalctl --user -u "$u" --no-pager > "/tmp/session_logs/$u.log" 2>&1 || true
        done
      continue-on-error: true

    - name: Upload session E2E diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: session-e2e-diagnostics
        path: /tmp/session_logs/
        if-no-files-found: warn
        retention-days: 7

  # Build summary

  # Docker image build. This is the gate that was missing: publish-apps.yml (and
  # publish-auth.yml) only trigger on push to main, so a Dockerfile that no
  # longer matches the tree -- a COPY of a directory the branch deleted, say --
  # got its first real build *after* the merge, and broke the deploy image
  # instead of the PR. That is exactly how EngineDesign/Dockerfile.api broke
  # main when PR #37 deleted engine/native.
  #
  # Same Dockerfile and context as the publisher, but push: false: this proves
  # the image builds, publishes nothing, and needs no GHCR login. cache-from
  # points at the publisher's cache scope so PRs reuse main's layers; nothing is
  # written back (GitHub isolates a branch's cache from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: daq-viewer, context: ./daq-server/tools/postprocessing/webviewer, dockerfile: ./daq-server/tools/postprocessing/webviewer/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - format-check
      - web-gui
      - build
      - code-quality
      - security-scan
      - thread-sanitizer
      - test
      - address-sanitizer
      - integration-test
      - playwright-guitest-e2e
      - session-systemd-e2e
      - docker-image
    if: always()

    steps:
    # Override the workflow-level `defaults.run.working-directory: daq-server`.
    # This job has no checkout step, so that directory doesn't exist on the
    # runner — bash would fail to start with "No such file or directory".
    - name: Check build status
      working-directory: .
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Format Check | ${{ needs.format-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Web GUI | ${{ needs.web-gui.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| ThreadSanitizer (sequencer) | ${{ needs.thread-sanitizer.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| ASan + UBSan (full stack) | ${{ needs.address-sanitizer.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Test | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Playwright E2E (guitest) | ${{ needs.playwright-guitest-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Session Control E2E (systemd) | ${{ needs.session-systemd-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker image (build, no push) | ${{ needs.docker-image.result }} |" >> $GITHUB_STEP_SUMMARY

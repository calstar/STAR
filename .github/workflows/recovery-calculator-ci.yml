name: Recovery Calculator CI

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true, which breaks
# workflow triggers in some parsers (matches daq-server-ci.yml).
'on':
  push:
    paths:
      - 'recovery-calculator/**'
      - '.github/workflows/recovery-calculator-ci.yml'
  pull_request:
    paths:
      - 'recovery-calculator/**'
      - '.github/workflows/recovery-calculator-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: recovery-calculator-${{ github.ref }}
  cancel-in-progress: true

# Two kinds of job here, and the split is deliberate.
#
# The `physics` job runs the physics core, which needs numpy/scipy/
# pydantic and therefore a venv. Everything else — the scraper and
# site-climatology — is **stdlib-only and fully offline**, with no pip install
# and no dependency cache. That is a design constraint of those trees, not an
# oversight: it is what lets them run on a bare python3 anywhere.
#
# If one of the *tool* jobs below ever needs `pip install`, something has
# drifted. `tests/test_imports.py` guards the boundary from the other side, by
# asserting that physics.atmosphere and physics.pad_state import
# with numpy, scipy and pydantic absent — which is what allows site-climatology
# to import the one canonical copy of PLAN.md §5 rather than keeping a second.

jobs:
  # physics: the physics core and the §12 validation suite.
  physics:
    name: physics (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: recovery-calculator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: recovery-calculator/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # test_tools.py shells out to the scraper's mock-server suite, which
      # needs loopback, so this job is not proxy-blocked. The tool jobs below
      # keep their own network guards.
      - name: Run tests
        run: |
          python -m pytest tests/ \
            --timeout=300 --timeout-method=thread \
            --durations=15 -q

      # PLAN.md §11.2 makes the CLI an invariant, not a development phase: it
      # is the escape hatch for bisecting a bug without React in the stack.
      - name: CLI smoke
        run: |
          python -m physics tests/fixtures/worked_example.json \
            --which axial > /dev/null
          echo "CLI runs"

      # The library must never import FastAPI (§11.2). The suite asserts this
      # from inside; assert it here too, because the import graph is exactly
      # the kind of thing that drifts when someone adds a convenience helper.
      - name: Library imports no web machinery
        run: |
          python -c "
          import sys
          import physics.solver, physics.cases, physics.report
          web = [m for m in sys.modules if m.split('.')[0] in
                 ('fastapi', 'uvicorn', 'starlette')]
          assert not web, 'library imported web machinery: ' + repr(web)
          print('library is web-free')
          "

  # backend: the API layer. A separate job from the physics because it can
  # fail on its own -- a route that does not import is invisible to pytest if
  # the test module skips on a missing dependency.
  backend:
    name: backend (import check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: recovery-calculator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: recovery-calculator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Enumerated from the OpenAPI schema rather than app.routes: the latter
      # holds framework-internal objects whose shape varies between FastAPI
      # versions, and building the schema also proves every response model is
      # serialisable.
      - name: Import the app and enumerate its routes
        run: |
          python -c "
          from backend.main import app
          paths = sorted(p for p in app.openapi()['paths'] if p.startswith('/api'))
          print(chr(10).join(paths))
          required = {'/api/health', '/api/simulate', '/api/devices',
                      '/api/atmosphere', '/api/climatology', '/api/sweep',
                      '/api/crosscheck'}
          missing = required - set(paths)
          assert not missing, 'missing routes: ' + repr(missing)
          print('backend.main imports OK, %d /api routes' % len(paths))
          "

  # frontend: type-check, unit tests, production build.
  #
  # The unit tests exist for one failure in particular: the GUI edits mass in
  # pounds, apogee in feet and the airframe in inches, while the backend is
  # unit-blind and will accept 12.5 as a mass in kilograms without complaint.
  # A 2.2x mass error changes every load by 2.2x and still looks plausible.
  # Nothing on the Python side can catch it, because by then the units are
  # gone -- so it has to be caught here.
  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: recovery-calculator/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: recovery-calculator/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit conversion tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # site-climatology: the atmosphere data pipeline (PLAN.md §5).
  #
  # Runs on a matrix because pyproject.toml declares target-version py39-py312
  # and these modules are stdlib-only, so honouring that floor costs one runner
  # and catches 3.10+ syntax the dev machine (3.12) would accept silently.
  site-climatology:
    name: site-climatology (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    defaults:
      run:
        working-directory: recovery-calculator/site-climatology

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The fetchers reach aviationweather.gov, mesonet.agron.iastate.edu and
      # ncei.noaa.gov; the tests must reach none of them. Pointing the proxy
      # vars at a closed port turns "someone added a live fetch to a test" into
      # a hard failure here, rather than an intermittent CI flake that only
      # shows up when NCEI is having a bad day. urllib honours these, and every
      # network call in this tree goes through urllib.
      #
      # Port 9 (discard) is closed on the runner, so the failure is a refused
      # connection. Behind a sandbox that swallows the connect it degrades to a
      # timeout instead — still a failure, just slower, which is what
      # timeout-minutes above is the backstop for.
      - name: Run tests (network blocked)
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        run: python3 test_site_climatology.py

      # _padstate.py imports physics.pad_state, the single canonical copy
      # of §5, after putting the subproject root on sys.path. It must resolve
      # into the package rather than to a leftover sibling copy -- and it must
      # do so with no venv, which is the property that made deleting the
      # duplicate implementation safe. Assert it rather than infer it from the
      # tests passing.
      - name: Verify the canonical pad_state import resolves
        run: |
          python3 -c "
          from _padstate import pad_state
          assert hasattr(pad_state, 'p_pad_metar'), 'eq (7b) missing'
          assert hasattr(pad_state, 'p_pad_isa'), 'eq (7a) missing'
          assert 'physics' in pad_state.__file__, \
              'resolved to a copy outside the package: ' + pad_state.__file__
          import sys
          heavy = [m for m in ('numpy', 'scipy', 'pydantic') if m in sys.modules]
          assert not heavy, 'stdlib-only boundary broken: ' + repr(heavy)
          print('pad_state loaded from', pad_state.__file__)
          "

      # Every module is a CLI. --help exercises import and argparse setup
      # without touching the network, which catches a syntax error or a bad
      # default in a script the test file does not import.
      - name: CLI smoke
        run: |
          python3 metar_history.py --help > /dev/null
          python3 temp_profile.py --help > /dev/null
          echo "CLIs load"

  # pad-state folded into physics/pad_state.py, and its suite was ported
  # to tests/test_pad_state.py, so it no longer has a job of its own. The
  # cross-module import above is what remains worth asserting separately.

  # fruity-chute-scraper: device table ingest (PLAN.md §4.1). test_mock.py
  # stands up a local HTTP server mimicking the vendor API shape, so it needs
  # loopback — hence no proxy block on this job, unlike site-climatology.
  fruity-chute-scraper:
    name: fruity-chute-scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: recovery-calculator/tools/fruity-chute-scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run mock-server tests
        run: python3 test_mock.py

  # frontend: React 19 + TS + Vite + Recharts + Tailwind (PLAN.md §11.1).
  #
  # `npm run build` runs `tsc -b` before vite, so this is a typecheck as much
  # as a build. That matters more than usual here for one specific reason:
  # src/api/client.ts assigns the committed climatology.json to the
  # `Climatology` interface with a plain annotation rather than an `as` cast,
  # so with resolveJsonModule on, tsc validates the actual data file against
  # the declared types. Rename a column in export_json.py without updating the
  # frontend and this job fails, instead of a chart silently going blank in
  # someone's browser.
  #
  # This is the only job that needs the network (npm registry), so no proxy
  # block. `npm ci` is used rather than `npm install` so the lockfile is
  # authoritative and a transitive bump cannot turn a green build red.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: recovery-calculator/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recovery-calculator/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  # Reported at the end so a failure is visible without opening each job.
  # It sets working-directory explicitly because it has no checkout step, so
  # any inherited subproject path would not exist on the runner.
  recovery-calculator-summary:
    name: recovery-calculator summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [physics, backend, site-climatology, fruity-chute-scraper, frontend]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Summary
        run: |
          {
            echo "## Recovery Calculator CI"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| physics (pytest) | ${{ needs.physics.result }} |"
            echo "| backend (import) | ${{ needs.backend.result }} |"
            echo "| frontend (vitest + build) | ${{ needs.frontend.result }} |"
            echo "| site-climatology | ${{ needs.site-climatology.result }} |"
            echo "| fruity-chute-scraper | ${{ needs.fruity-chute-scraper.result }} |"
            echo "| frontend (lint+build) | ${{ needs.frontend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

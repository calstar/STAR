name: STARProject CI

'on':
  push:
    paths:
      - 'starproject/**'
      # The finance serializer's test reads the worker's accepted keys from here.
      - 'callink-worker/request.mjs'
      - '.github/workflows/starproject-ci.yml'
  pull_request:
    paths:
      - 'starproject/**'
      - 'callink-worker/request.mjs'
      - '.github/workflows/starproject-ci.yml'
  workflow_dispatch:

# Newer pushes to the same ref supersede in-progress runs.
concurrency:
  group: starproject-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      - name: Prisma generate
        working-directory: starproject
        run: npx prisma generate
      - name: Lint
        working-directory: starproject
        run: npm run lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      - name: Prisma generate
        working-directory: starproject
        run: npx prisma generate
      - name: Typecheck
        working-directory: starproject
        run: npm run typecheck

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      - name: Test
        working-directory: starproject
        run: npm test

  build:
    name: Build (Next.js + Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      # `next build` is force-dynamic on every page, so no database is needed.
      - name: Build
        working-directory: starproject
        run: npm run build

  migrations:
    name: Migrations apply (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starproject
          POSTGRES_PASSWORD: starproject
          POSTGRES_DB: starproject
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starproject"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://starproject:starproject@localhost:5432/starproject?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      # Schema is valid and every committed migration applies cleanly to an
      # empty database.
      - name: Validate schema
        working-directory: starproject
        run: npx prisma validate
      - name: Apply migrations
        working-directory: starproject
        run: npx prisma migrate deploy

  # Browser tests (Playwright, e2e/): the production build, a real Postgres and
  # the demo seed, driven like a person drives it. Lint/typecheck/unit tests
  # check the code still compiles and the pure logic still adds up; these check
  # the features are still *there* -- a merge that drops a view, a column or a
  # button goes red here instead of being noticed weeks later. Adding a feature?
  # Add its check to e2e/ in the same PR.
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: starproject/package-lock.json
      - name: Install dependencies
        working-directory: starproject
        run: npm ci
      - name: Install Chromium
        working-directory: starproject
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: starproject
        run: npm run build
      # scripts/e2e-server.mjs brings up its own throwaway Postgres
      # (embedded-postgres), so no services: block is needed.
      - name: Browser tests
        working-directory: starproject
        env:
          E2E_BUILT: '1'
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            starproject/playwright-report
            starproject/test-results
          retention-days: 14

  # Docker image build. This is the gate that was missing: publish-apps.yml (and
  # publish-auth.yml) only trigger on push to main, so a Dockerfile that no
  # longer matches the tree -- a COPY of a directory the branch deleted, say --
  # got its first real build *after* the merge, and broke the deploy image
  # instead of the PR. That is exactly how EngineDesign/Dockerfile.api broke
  # main when PR #37 deleted engine/native.
  #
  # Same Dockerfile and context as the publisher, but push: false: this proves
  # the image builds, publishes nothing, and needs no GHCR login. cache-from
  # points at the publisher's cache scope so PRs reuse main's layers; nothing is
  # written back (GitHub isolates a branch's cache from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: starproject, context: ./starproject, dockerfile: ./starproject/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

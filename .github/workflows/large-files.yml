name: Large File Check

on:
  pull_request:

jobs:
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for files over 5 MB added or modified in this PR
        env:
          MAX_BYTES: 5242880
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          fail=0
          while IFS= read -r -d '' file; do
            blob=$(git rev-parse --verify --quiet "HEAD:$file") || continue
            size=$(git cat-file -s "$blob")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "::error file=$file::$file is $size bytes (limit: $MAX_BYTES). Keep generated data and build artifacts out of the repo, or use Git LFS."
              fail=1
            fi
          done < <(git diff -z --name-only --diff-filter=AM "$base" HEAD)
          if [ "$fail" -ne 0 ]; then
            echo "Large files detected. This check compares against the merge-base, so only files added or modified by this PR are flagged."
            exit 1
          fi
          echo "OK: no files over $MAX_BYTES bytes added or modified."

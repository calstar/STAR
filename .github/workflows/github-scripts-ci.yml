name: GitHub scripts CI

# Unit tests for the scripts workflows run (.github/scripts/*.test.mjs).

'on':
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/github-scripts-ci.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/github-scripts-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: node --test .github/scripts/

name: Publish app images

# Builds every app image and pushes it to GHCR so the apps machine can pull
# instead of building locally (five React builds are RAM-hungry). auth is
# published separately by publish-auth.yml. See deploy/apps/README.md.

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true (matches the repo's
# other workflows).
'on':
  push:
    # main is the deploy branch (landing-page and ork-onshape were merged in and retired).
    branches:
      - main
    paths:
      - 'EngineDesign/**'
      - 'pid-designer/**'
      - 'recovery-calculator/**'
      - 'star-openrocket/**'
      - 'daq-server/tools/postprocessing/webviewer/**'
      - 'landing/**'
      - '.github/workflows/publish-apps.yml'
  workflow_dispatch:

concurrency:
  group: publish-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: landing,                      context: ./landing,                   dockerfile: ./landing/Dockerfile }
          # engine-design-api builds from the repo root (native kernel + several
          # EngineDesign/ subtrees) -- see EngineDesign/Dockerfile.api.
          - { name: engine-design-api,            context: .,                           dockerfile: ./EngineDesign/Dockerfile.api }
          - { name: engine-design-frontend,       context: ./EngineDesign/frontend,     dockerfile: ./EngineDesign/frontend/Dockerfile }
          - { name: pid-designer-api,             context: ./pid-designer,              dockerfile: ./pid-designer/Dockerfile.api }
          - { name: pid-designer-frontend,        context: ./pid-designer/frontend,     dockerfile: ./pid-designer/frontend/Dockerfile }
          - { name: recovery-calculator-api,      context: ./recovery-calculator,       dockerfile: ./recovery-calculator/Dockerfile.api }
          - { name: recovery-calculator-frontend, context: ./recovery-calculator/frontend, dockerfile: ./recovery-calculator/frontend/Dockerfile }
          - { name: star-openrocket-api,           context: ./star-openrocket,            dockerfile: ./star-openrocket/Dockerfile.api }
          - { name: star-openrocket-frontend,      context: ./star-openrocket/frontend,   dockerfile: ./star-openrocket/frontend/Dockerfile }
          # DAQ Run Viewer: one image serves both API and SPA (see its Dockerfile).
          - { name: daq-viewer,                   context: ./daq-server/tools/postprocessing/webviewer, dockerfile: ./daq-server/tools/postprocessing/webviewer/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      # Buildx's container driver -- required for the type=gha cache exporter.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so the matrix jobs don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

name: Onshape Viewer CI

# Quoted `on` — YAML 1.1 treats bare `on` as boolean true, which breaks
# workflow triggers in some parsers (matches daq-server-ci.yml).
'on':
  push:
    paths:
      - 'onshape-viewer/**'
      - '.github/workflows/onshape-viewer-ci.yml'
  pull_request:
    paths:
      - 'onshape-viewer/**'
      - '.github/workflows/onshape-viewer-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: onshape-viewer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: onshape-viewer

# NO ONSHAPE CREDENTIALS ARE SET ANYWHERE IN THIS WORKFLOW, DELIBERATELY.
#
# Onshape bills per API call against a finite quota, and a cold build of the
# reference assembly costs ~22 calls. CI runs on every push, so a workflow that
# talked to Onshape would burn the team's quota on nothing.
#
# Three things keep that true, so it does not rest on this comment:
#   1. tests/conftest.py blocks socket.connect for every test — an accidental
#      live call raises instead of dialling out.
#   2. OnshapeClient reads ONSHAPE_ACCESS_KEY / ONSHAPE_SECRET_KEY from the
#      environment with no defaults and raises MissingCredentials when unset.
#   3. The `offline-guarantee` job below asserts both of the above still hold.
#
# If you ever need a live check, gate it behind a manually-dispatched workflow —
# not this one.

jobs:
  # Python regression gate. Fully offline: every Onshape response the suite
  # needs is a committed fixture under tests/fixtures/.
  python-tests:
    name: Python tests (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: onshape-viewer/requirements-ci.txt

    - name: Install dependencies (CI subset)
      run: pip install -r requirements-ci.txt

    # --timeout guards against a test that somehow gets past the socket block
    # and then hangs on a real connection. thread method so a stuck C-level
    # call is still interrupted.
    - name: Run test gate
      run: |
        python -m pytest tests/ \
          --timeout=120 --timeout-method=thread \
          --durations=15 -q

  # Positive proof that the suite cannot spend API quota, rather than an
  # assumption that nobody will ever add a live test.
  offline-guarantee:
    name: Offline guarantee (no Onshape API calls)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: onshape-viewer/requirements-ci.txt

    - name: Install dependencies (CI subset)
      run: pip install -r requirements-ci.txt

    # A request with no credentials must fail loudly. If this ever passes, the
    # keys have acquired a default somewhere and CI could start billing us.
    # `_auth()` is where the environment is read, and it is reached before any
    # socket is opened, so this asserts the guarantee without a network call.
    - name: Credentials are absent and required
      env:
        ONSHAPE_ACCESS_KEY: ''
        ONSHAPE_SECRET_KEY: ''
      run: |
        python -c "
        from backend.onshape.client import MissingCredentials, OnshapeClient
        try:
            OnshapeClient._auth()
        except MissingCredentials as exc:
            print('OK: no usable credentials in this environment:', exc)
        else:
            raise SystemExit('FAIL: credentials resolved with none set')
        "

    # The socket block in conftest.py is what makes 'the tests are offline' a
    # property rather than a convention. Prove it still bites by asking a
    # throwaway test to reach the network and requiring that it fails.
    - name: Test-suite socket block is active
      run: |
        cat > tests/test_ci_offline_guard.py <<'PY'
        import httpx
        import pytest


        def test_network_is_blocked():
            with pytest.raises(RuntimeError, match="network access is blocked"):
                httpx.get("https://example.com", timeout=5)
        PY
        python -m pytest tests/test_ci_offline_guard.py -q --timeout=60
        rm tests/test_ci_offline_guard.py

  # Backend imports cleanly (FastAPI app + all routes load) with no credentials.
  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: onshape-viewer/requirements-ci.txt

    - name: Install dependencies
      run: pip install -r requirements-ci.txt

    - name: Import backend app
      run: python -c "from backend.main import app; print('backend.main imports OK')"

  # Frontend type-checks and builds (tsc -b && vite build).
  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: onshape-viewer/frontend/package-lock.json

    - name: Install dependencies
      working-directory: onshape-viewer/frontend
      run: npm ci || npm install

    - name: TypeScript build
      working-directory: onshape-viewer/frontend
      run: npm run build

  # Aggregate status, mirroring engine-design-ci.yml's summary job.

  # Docker image build. This is the gate that was missing: publish-apps.yml (and
  # publish-auth.yml) only trigger on push to main, so a Dockerfile that no
  # longer matches the tree -- a COPY of a directory the branch deleted, say --
  # got its first real build *after* the merge, and broke the deploy image
  # instead of the PR. That is exactly how EngineDesign/Dockerfile.api broke
  # main when PR #37 deleted engine/native.
  #
  # Same Dockerfile and context as the publisher, but push: false: this proves
  # the image builds, publishes nothing, and needs no GHCR login. cache-from
  # points at the publisher's cache scope so PRs reuse main's layers; nothing is
  # written back (GitHub isolates a branch's cache from the default branch's
  # anyway, so a PR could not poison them even if it tried).
  docker-image:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: onshape-viewer-api,      context: ./onshape-viewer,          dockerfile: ./onshape-viewer/Dockerfile.api }
          - { name: onshape-viewer-frontend, context: ./onshape-viewer/frontend, dockerfile: ./onshape-viewer/frontend/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  onshape-viewer-summary:
    name: Onshape Viewer Summary
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - offline-guarantee
      - backend-smoke
      - frontend
      - docker-image
    if: always()

    steps:
    # No checkout in this job, so the workflow-level working-directory does not
    # exist on the runner — override it or bash fails to start.
    - name: Summary
      working-directory: .
      run: |
        echo "## Onshape Viewer CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Python tests (gate) | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Offline guarantee | ${{ needs.offline-guarantee.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend smoke | ${{ needs.backend-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend build | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker images (build, no push) | ${{ needs.docker-image.result }} |" >> $GITHUB_STEP_SUMMARY

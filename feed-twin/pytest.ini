# Makes `pytest tests` work, not just `python -m pytest tests`.
#
# `python -m pytest` puts the working directory on sys.path; a bare `pytest`
# does not. Without this, running `pytest` from feed-twin/ fails to collect
# tests/test_health.py with a bare "ModuleNotFoundError: No module named
# 'backend'" -- which reads like a broken install rather than a missing
# sys.path entry, and is a genuinely confusing first impression of the repo.
#
# `pythonpath` needs pytest >= 7. CI installs current pytest; if you are on an
# older one, use `python -m pytest` instead.
[pytest]
pythonpath = .
testpaths = tests
# Tests that integrate minutes of stand time. `scripts/check.sh` (fast tier) and
# `pytest -m "not slow"` skip them; CI and `scripts/check.sh full` run them all.
markers =
    slow: integrates minutes of stand time; skipped by the fast tier

[platformio]
extra_configs = ../platformio-common.ini

[env:bluetooth_switch]
extends = esp32c3_usb_base
; Arduino as an ESP-IDF component, so sdkconfig.defaults can turn on light sleep
; and BLE modem sleep; the prebuilt Arduino SDK has both off (~80 mA idle).
framework = arduino, espidf
board_build.f_cpu = 80000000L
; Keeps the image free of absolute build paths, so the same commit hashes the
; same on every machine and CI's firmware registry can name it.
extra_scripts =
    pre:../tools/reproducible_build.py
    post:../tools/stripped_elf_image.py
lib_deps =
    ; 1.4.x matches arduino-esp32 2.x (espressif32@7.1.3); 2.x changed the callback API.
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ${esp32c3_usb_base.build_flags}
    -Iinclude
    ; Peripheral role only; drops the central/observer code and its RAM.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Several phones at once (pad crew + range safety). Each link costs ~1 KB of RAM.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

; Ball Valve Hotfire - motorized ball valve prototype board
; ESP32-WROOM-32 + W5500. One valve: 5 V enable into its 4-20 mA driver through
; an NMOS on GPIO25, 4-20 mA position readback across 100 ohm on GPIO32.
; Pins are hardcoded in src/main.cpp (prototype). See src/main.cpp.

[platformio]
extra_configs = ../../platformio-common.ini
; Plain `pio run` / `pio run -t upload` is the USB build only; OTA stays
; explicit: `pio run -e ota -t upload`.
default_envs = esp32dev

[env:esp32dev]
extends = esp32_classic_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
build_flags =
    ${esp32_classic_base.build_flags}
    -I../common
    -I../../common
    ; Board identity. 71 is not used by any board in
    ; daq-server/config/config_base.toml [boards.*]; the static fallback
    ; address is 192.168.2.71.
    -DBOARD_ID=71
    ; Ask the ground station for an address by DHCP, falling back to the
    ; static 192.168.2.<BOARD_ID>. See common/board_net.h.
    -DSENSOR_ETH_USE_DHCP

; ----------------------------------------------------------------------------
; Ethernet OTA: same build, pushed over the network instead of USB.
;   pio run -e ota -t upload
; --ip must be where the board actually is; it prints it on its serial log.
; ----------------------------------------------------------------------------
[env:ota]
extends = env:esp32dev
upload_protocol = custom
extra_scripts = post:../../tools/pio_ota_upload.py
upload_flags =
    --ip=192.168.2.71

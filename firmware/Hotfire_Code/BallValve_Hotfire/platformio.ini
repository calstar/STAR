; Ball Valve Hotfire - STAR Prop Receiver v2
; ESP32-S3-WROOM-1-N16R2 + W5500. Two 4-20 mA valve channels, each an MCP4728
; DAC channel into an XTR111 command loop, with the actuator's 4-20 mA
; position feedback, the loop's return current and the XTR111 error flag read
; back. Pins and values: HARDWARE.md. Console and flashing are the S3's own
; USB-Serial-JTAG on the USB-C port (no UART bridge).

[platformio]
extra_configs = ../../platformio-common.ini
; Plain `pio run` / `pio run -t upload` is the USB build only; OTA stays
; explicit: `pio run -e ota -t upload`.
default_envs = esp32s3

[env:esp32s3]
extends = esp32s3_base
; N16R2: 16 MB quad flash. The 2 MB quad PSRAM is not used.
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Keeps the built image free of absolute build paths, so the same commit
; hashes the same on every machine and CI's firmware registry can name it.
; See firmware/tools/reproducible_build.py.
extra_scripts = pre:../../tools/reproducible_build.py
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
build_flags =
    ${esp32s3_base.build_flags}
    ; Serial on the hardware USB-Serial-JTAG, not TinyUSB: esptool's
    ; auto-reset into download mode needs it left alone.
    -DARDUINO_USB_MODE=1
    -I../common
    -I../../common
    ; The ground station assigns this board's address, and its ID with it
    ; (192.168.2.31 -> board 31): every board of this type runs this same image,
    ; and which board is which is the `mac =` line in daq-server's config.
    ; daq-server's dnsmasq answers from the MAC -> IP reservation table. The
    ; board broadcasts BOARD_HEARTBEAT until a server is heard, and learns the
    ; server's address from that packet. If no DHCP server answers it takes its
    ; MAC-derived recovery address 169.254.x.y (reflash only; see
    ; firmware/tools/ota_upload.py --mac) and keeps asking. See common/board_net.h.
    -DSENSOR_ETH_USE_DHCP

; ----------------------------------------------------------------------------
; Ethernet OTA: same build, pushed over the network instead of USB.
;   pio run -e ota -t upload
; --ip must be where the board actually is; it prints it on its serial log.
; ----------------------------------------------------------------------------
[env:ota]
extends = env:esp32s3
upload_protocol = custom
extra_scripts =
    pre:../../tools/reproducible_build.py
    post:../../tools/pio_ota_upload.py
upload_flags =
    --ip=192.168.2.71

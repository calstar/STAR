[platformio]
extra_configs = ../../platformio-common.ini
; Plain `pio run` / `pio run -t upload` means the USB build only. Without this
; PlatformIO builds every env, so a USB upload also ran the [env:ota] upload
; and failed on a board that was never meant to be flashed over the network.
; OTA stays explicit: `pio run -e ota -t upload`.
default_envs = adafruit_feather_esp32s3

[env:adafruit_feather_esp32s3]
extends = esp32s3_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
build_flags =
    ${esp32s3_base.build_flags}
    -I../common
    -I../../common
    ; Board identity, from daq-server/config/config.toml [boards.actuator_board].
    ; Without this every board reports the default id 21 and falls back to the
    ; same 192.168.2.21, so two of them on one wire collide.
    ; For board #2, build with: PLATFORMIO_BUILD_FLAGS=-DBOARD_ID=12 pio run
    -DBOARD_ID=11
    -DBOARD_HAS_PSRAM=0
    ; The ground station assigns this board's address. The board asks by DHCP
    ; and uses whatever it is given; daq-server's dnsmasq answers from the
    ; MAC -> IP reservation table generated out of config_base.toml [boards.*].
    ; It broadcasts BOARD_HEARTBEAT until a server is heard, and learns the
    ; server's address from that packet. See common/board_net.h.
    ; If no DHCP server answers it falls back to the static 192.168.2.<BOARD_ID>,
    ; so the board is never mute; add -DSTAR_NET_DHCP_ONLY to drop even that.
    -DSENSOR_ETH_USE_DHCP

; ----------------------------------------------------------------------------
; Ethernet OTA: same build, pushed over the network instead of USB.
;   pio run -e ota -t upload
; --ip must be where the board actually is -- i.e. the address the ground
; station assigned it. The Test-GUI's Addresses tab shows that mapping, and
; the board prints it on its serial log at boot.
; ----------------------------------------------------------------------------
[env:ota]
extends = env:adafruit_feather_esp32s3
upload_protocol = custom
extra_scripts = post:../../tools/pio_ota_upload.py
upload_flags =
    --ip=192.168.2.11

; LC1 is N16R2 and LC2 is N4R8 (mistake but resoldering is annoying).
; For magic-ass reasons forcing 4MB flash + default partitions makes
; the same image upload to both correctly. See esp32s3_lc_base.

[platformio]
extra_configs = ../../platformio-common.ini

[env:adafruit_feather_esp32s3]
extends = esp32s3_lc_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
build_flags =
    ${esp32s3_lc_base.build_flags}
    -I../common
    -I../../common
    ; Board identity, from daq-server/config/config.toml [boards.lc_board_2].
    ; It sets the last octet of the static IP, so this board is 192.168.2.42.
    ; Without it every board reports the default id 21 and lands on
    ; 192.168.2.21, so two of them on one wire collide.
    ; For LC board #1, build with: PLATFORMIO_BUILD_FLAGS=-DBOARD_ID=41 pio run
    -DBOARD_ID=42
    -DBOARD_HAS_PSRAM=0

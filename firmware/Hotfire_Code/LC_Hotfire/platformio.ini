; LC1 is N16R2 and LC2 is N4R8 (mistake but resoldering is annoying).
; For magic-ass reasons forcing 4MB flash + default partitions makes
; the same image upload to both correctly. See esp32s3_lc_base.

[platformio]
extra_configs = ../../platformio-common.ini

[env:adafruit_feather_esp32s3]
extends = esp32s3_lc_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
build_flags =
    ${esp32s3_lc_base.build_flags}
    -I../common
    -I../../common
    -DBOARD_HAS_PSRAM=0
    ; Zero-config networking (LC-only opt-in; PT/TC/RTD stay pure static):
    ; DHCP -> static 192.168.2.<BOARD_ID> -> alternating link-local 169.254.x.y
    ; hunt, broadcast BOARD_HEARTBEAT until a server is heard, then learn the
    ; server's IP from its packets and lock the address for the session.
    -DSENSOR_ETH_ZEROCONF

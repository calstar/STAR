; LC1 is N16R2 and LC2 is N4R8 (mistake but resoldering is annoying).
; For magic-ass reasons forcing 4MB flash + default partitions makes
; the same image upload to both correctly. See esp32s3_lc_base.

[platformio]
extra_configs = ../../platformio-common.ini
; Plain `pio run` / `pio run -t upload` means the USB build only. Without this
; PlatformIO builds every env, so a USB upload also ran the [env:ota] upload
; and failed on a board that was never meant to be flashed over the network.
; OTA stays explicit: `pio run -e ota -t upload`.
default_envs = adafruit_feather_esp32s3

[env:adafruit_feather_esp32s3]
extends = esp32s3_lc_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
    ; Pulled in through common/SensorHotfireCore.h, which lives on an -I path
    ; the library dependency finder never scans -- so name it explicitly or the
    ; build fails with "STAR_EthernetOTA.h: No such file or directory".
    STAR_EthernetOTA
build_flags =
    ${esp32s3_lc_base.build_flags}
    -I../common
    -I../../common
    -DBOARD_HAS_PSRAM=0
    ; The ground station assigns this board's address, and its ID with it
    ; (192.168.2.31 -> board 31): every board of this type runs this same image,
    ; and which board is which is the `mac =` line in daq-server's config.
    ; daq-server's dnsmasq answers from the MAC -> IP reservation table. The
    ; board broadcasts BOARD_HEARTBEAT until a server is heard, and learns the
    ; server's address from that packet. If no DHCP server answers it takes its
    ; MAC-derived recovery address 169.254.x.y (reflash only; see
    ; firmware/tools/ota_upload.py --mac) and keeps asking. See common/board_net.h.
    -DSENSOR_ETH_USE_DHCP

; ----------------------------------------------------------------------------
; Ethernet OTA: same build, pushed over the network instead of USB.
;   pio run -e ota -t upload
; --ip must be where the board actually is -- i.e. the address the ground
; station assigned it. The Test-GUI's Addresses tab shows that mapping, and
; the board prints it on its serial log at boot.
; ----------------------------------------------------------------------------
[env:ota]
extends = env:adafruit_feather_esp32s3
upload_protocol = custom
extra_scripts = post:../../tools/pio_ota_upload.py
upload_flags =
    --ip=192.168.2.41

[platformio]
extra_configs = ../../platformio-common.ini

[env:adafruit_feather_esp32s3]
extends = esp32s3_base
lib_extra_dirs =
    ../../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    Update
    ; Pulled in through common/SensorHotfireCore.h, which lives on an -I path
    ; the library dependency finder never scans -- so name it explicitly or the
    ; build fails with "STAR_EthernetOTA.h: No such file or directory".
    STAR_EthernetOTA
build_flags =
    ${esp32s3_base.build_flags}
    -I../common
    -I../../common
    -DBOARD_HAS_PSRAM=0
    ; The ground station assigns this board's address, and its ID with it
    ; (192.168.2.31 -> board 31): every board of this type runs this same image,
    ; and which board is which is the `mac =` line in daq-server's config.
    ; daq-server's dnsmasq answers from the MAC -> IP reservation table. The
    ; board broadcasts BOARD_HEARTBEAT until a server is heard, and learns the
    ; server's address from that packet. If no DHCP server answers it takes its
    ; MAC-derived recovery address 169.254.x.y (reflash only; see
    ; firmware/tools/ota_upload.py --mac) and keeps asking. See common/board_net.h.
    -DSENSOR_ETH_USE_DHCP

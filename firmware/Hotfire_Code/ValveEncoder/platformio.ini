; ValveEncoder - ball valve encoder board: AS5600 -> ESP32-S3 -> RS-485
;
;   pio run -e valve_encoder -t upload     build + flash the real PCB
;   pio run -e valve_encoder_devkit        breadboard (dev kit) pin layout
;   pio test -e native                     host unit tests, no hardware
;   pio device monitor                     USB console (type h)
;
; Uses only the Arduino core (Wire, Preferences) and firmware/common, so
; unlike the Ethernet boards it does not need firmware/libraries
; (daq-protocol, EthernetHandler, ...).

[platformio]
extra_configs = ../../platformio-common.ini
default_envs = valve_encoder

[env:valve_encoder]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -I../../common
    ; One ID per valve, 1..254. Ask the Receiver Board owner for the numbering.
    -DVALVE_ID=1
    ; Must match the Receiver Board.
    -DRS485_BAUD=115200
    ; RS485_MODE_STREAM: one cable per valve, send 50x/s unprompted.
    ; RS485_MODE_POLLED: shared bus, answer only POLLs addressed to VALVE_ID.
    -DRS485_MODE_STREAM

[env:valve_encoder_devkit]
extends = env:valve_encoder
build_flags =
    ${env:valve_encoder.build_flags}
    -DVALVE_BENCH_DEVKIT

[env:native]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -Iinclude
test_build_src = no

[platformio]
extra_configs = ../../platformio-common.ini
default_envs = valve_encoder

[env:valve_encoder]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -I../../common
    ; 1..254, unique per Receiver Board
    -DVALVE_ID=1
    -DRS485_BAUD=115200
    ; or -DRS485_MODE_POLLED for a shared bus
    -DRS485_MODE_STREAM

[env:valve_encoder_devkit]
extends = env:valve_encoder
build_flags =
    ${env:valve_encoder.build_flags}
    -DVALVE_BENCH_DEVKIT

[env:native]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -Iinclude
test_build_src = no

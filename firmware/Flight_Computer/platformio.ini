; Flight Computer (STM32H723VET6)
;
;   pio test -e native              radio tests on a laptop, no board
;   pio run  -e flight -t upload    build for the board and flash over ST-Link
;
; Read STM32-UPLOAD-REQUIREMENTS.md first.

[platformio]
; VS Code's Build / Upload buttons (and a bare `pio run`) use the real board.
; Laptop tests are always named explicitly: pio test -e native
default_envs = flight

; The real board. `star_fc_h723ve` is defined in boards/star_fc_h723ve.json
; because PlatformIO has no VET6 board: the closest, nucleo_h723zg, is a ZG
; part with 1 MB of flash; ours has 512 KB.
;
; No `framework`: the code is CubeMX's own (Core/, Drivers/, Middlewares/,
; startup file, linker script), so the HAL version matches the .ioc exactly.
; The source list, include paths and defines below mirror what CubeMX writes
; in cmake/stm32cubemx/CMakeLists.txt. If a Generate Code adds a peripheral,
; its HAL file lands in Drivers/.../Src and is picked up automatically.
[env:flight]
platform = ststm32@20.0.0
board = star_fc_h723ve
upload_protocol = stlink
debug_tool = stlink
; The tests in test/ run on the laptop (env:native), not on the board.
test_ignore = *
; GCC 14.2. The platform's default is GCC 7.2, which cannot link CubeMX's
; linker script (READONLY needs GCC 11+). PlatformIO downloads this itself.
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
board_build.ldscript = STM32H723xx_FLASH.ld
; Paths are relative to src/, hence ../
build_src_filter =
    -<*>
    +<../Core/Src/*.c>
    +<../drivers/*.c>
    +<../app/*.c>
    +<../startup_stm32h723xx.s>
    +<../Drivers/STM32H7xx_HAL_Driver/Src/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/Common/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/*.c>
build_flags =
    -DUSE_PWR_LDO_SUPPLY
    -DUSE_HAL_DRIVER
    -DSTM32H723xx
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -ICore/Inc
    -Idrivers
    -Iapp
    -IDrivers/STM32H7xx_HAL_Driver/Inc
    -IDrivers/STM32H7xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32H7xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/RTOS2/Include
    -IMiddlewares/Third_Party/FreeRTOS/Source/include
    -IMiddlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -IMiddlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
extra_scripts = pre:scripts/fpu_link_flags.py

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Wall
    -Wextra
    -Wshadow
    -Werror

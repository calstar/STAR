; Flight Computer (STM32H723VET6)
;
;   pio test -e native              radio tests on a laptop, no board (tests/radio)
;   pio run  -e flight -t upload    build for the board and flash over ST-Link
;
; Read STM32-UPLOAD-REQUIREMENTS.md first.

[platformio]
; VS Code's Build / Upload buttons (and a bare `pio run`) use the real board.
; Laptop tests are always named explicitly: pio test -e native
default_envs = flight
; One tests folder: PlatformIO's own (Unity) suites live in tests/radio, next
; to the CMake host suites; env:native picks only radio/ (test_filter).
test_dir = tests

; The real board. `star_fc_h723ve` is defined in boards/star_fc_h723ve.json
; because PlatformIO has no VET6 board: the closest, nucleo_h723zg, is a ZG
; part with 1 MB of flash; ours has 512 KB.
;
; No `framework`: the code is CubeMX's own (Core/, Drivers/, Middlewares/,
; startup file, linker script), so the HAL version matches the .ioc exactly.
; The source list, include paths and defines below mirror what CubeMX writes
; in cmake/stm32cubemx/CMakeLists.txt. If a Generate Code adds a peripheral,
; its HAL file lands in Drivers/.../Src and is picked up automatically.
[env:flight]
platform = ststm32@20.0.0
board = star_fc_h723ve
upload_protocol = stlink
debug_tool = stlink
; Connect under reset (NRST held while the ST-Link attaches): once the Idle
; firmware is on the board, the chip sits in Stop most of the time and a
; plain upload cannot halt it. Needs NRST wired to the ST-Link (P1).
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
; The tests in tests/ run on the laptop, not on the board.
test_ignore = *
; GCC 14.2. The platform's default is GCC 7.2, which cannot link CubeMX's
; linker script (READONLY needs GCC 11+). PlatformIO downloads this itself.
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
board_build.ldscript = STM32H723xx_FLASH.ld
; Paths are relative to src/. Hand-written code is src/{board,chips,radio,app};
; CubeMX's is ../Core, ../Drivers, ../Middlewares.
build_src_filter =
    -<*>
    +<board/*.c>
    +<chips/*.c>
    +<chips/*.cpp>
    +<radio/*.cpp>
    +<app/*.c>
    +<../Core/Src/*.c>
    +<../startup_stm32h723xx.s>
    +<../Drivers/STM32H7xx_HAL_Driver/Src/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/Common/*.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>
    +<../Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/*.c>
build_flags =
    -DUSE_PWR_LDO_SUPPLY
    -DUSE_HAL_DRIVER
    -DSTM32H723xx
    ; debug info for gdb over the ST-Link (g_bringup_report): it stays in
    ; the .elf, nothing extra is flashed
    -g3
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -ICore/Inc
    -Isrc/board
    -Isrc/chips
    -Isrc/radio
    -Isrc/app
    -IDrivers/STM32H7xx_HAL_Driver/Inc
    -IDrivers/STM32H7xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32H7xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/RTOS2/Include
    -IMiddlewares/Third_Party/FreeRTOS/Source/include
    -IMiddlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -IMiddlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
extra_scripts = pre:scripts/fpu_link_flags.py

[env:native]
platform = native
test_framework = unity
; Only the radio suites are PlatformIO's; the rest of tests/ is CMake.
test_filter = radio/*
build_flags =
    -Isrc/chips
    -Isrc/radio
    -Wall
    -Wextra
    -Wshadow
    -Werror

; Bench only, never flown: skips Idle and keeps the sensors and GPS running
; so their readings can be watched over SWD (scripts/live.py).
;   pio run -e bench -t upload
[env:bench]
extends = env:flight
build_flags =
    ${env:flight.build_flags}
    -DSTAR_BENCH

; Radio link test between two boards (bench only, never flown). Flash one
; board with each, then watch both with scripts/serial.sh:
;   pio run -e bench_rx -t upload     # listens, prints RSSI/SNR/lost per frame
;   pio run -e bench_tx -t upload     # sends a numbered frame once a second
; TX power is lowered to +14 dBm for the bench (flight: +22). Antennas on
; BOTH boards before powering the TX one.
[env:bench_rx]
extends = env:bench
build_flags =
    ${env:bench.build_flags}
    -DBENCH_RADIO=1

[env:bench_tx]
extends = env:bench
build_flags =
    ${env:bench.build_flags}
    -DBENCH_RADIO=2
    -DSTAR_RADIO_POWER_DBM=14

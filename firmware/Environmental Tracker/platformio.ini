[platformio]
extra_configs = ../platformio-common.ini

; The environmental board is an ESP32-C3-WROOM with a W5500 and a BME280.
; Wall/Ethernet powered, so it stays on the prebuilt Arduino core (no light
; sleep, unlike the Bluetooth switch).
[env:environmental]
extends = esp32c3_usb_base
; Keeps the image free of absolute build paths, so the same commit hashes the
; same on every machine and CI's firmware registry can name it.
extra_scripts = pre:../tools/reproducible_build.py
lib_extra_dirs =
    ../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    adafruit/Adafruit BME280 Library@^2.2.4
build_flags =
    ${esp32c3_usb_base.build_flags}
    -I../Hotfire_Code/common

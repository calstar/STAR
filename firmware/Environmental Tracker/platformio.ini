[platformio]
extra_configs = ../platformio-common.ini

; The environmental board is an ESP32-C3-WROOM with a W5500 and a BME280.
; Wall/Ethernet powered, so it stays on the prebuilt Arduino core (no light
; sleep, unlike the Bluetooth switch).
[env:environmental]
extends = esp32c3_usb_base
; Keeps the image free of absolute build paths, so the same commit hashes the
; same on every machine and CI's firmware registry can name it.
extra_scripts = pre:../tools/reproducible_build.py
lib_extra_dirs =
    ../libraries
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    adafruit/Adafruit BME280 Library@^2.2.4
    ; Same NimBLE as the Bluetooth switch: 1.4.x matches arduino-esp32 2.x.
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ${esp32c3_usb_base.build_flags}
    -I../Hotfire_Code/common
    ; BLE central only (it relays the Bluetooth switches): drops the
    ; peripheral/broadcaster code and its RAM.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; One link per switch, at most daq::MAX_SWITCHES (5).
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5

; Host tests for the switch relay logic (no ESP32): pio test -e native
[env:native]
extends = native_base
build_flags =
    -std=gnu++17
    -I../../lib/daq-protocol/src
lib_ignore = Ethernet, Adafruit BME280 Library, STAR_EthernetOTA, daq-protocol

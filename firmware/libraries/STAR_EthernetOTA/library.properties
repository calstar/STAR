paragraph=One implementation of the TCP OTA listener shared by every STAR board with a W5500 - sense boards, actuator, stacklight, encoder, environmental tracker. Length-prefixed image over TCP, written with the ESP32 Update API, with start/progress/end callbacks and an optional bench-test marker for confirming an update landed.
